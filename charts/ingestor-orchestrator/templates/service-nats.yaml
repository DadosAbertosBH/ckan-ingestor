{{- if .Values.nats.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-nats
  labels:
    {{- include "ingestor-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 4222
      targetPort: client
      protocol: TCP
    - name: monitoring
      port: 8222
      targetPort: monitoring
      protocol: TCP
  selector:
    {{- include "ingestor-orchestrator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nats
{{- end }}
