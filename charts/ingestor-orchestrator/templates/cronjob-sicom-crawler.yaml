{{- if .Values.sicomCrawler.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ingestor-orchestrator.fullname" . }}-sicom-crawler
  labels:
    {{- include "ingestor-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: sicom-crawler
spec:
  schedule: {{ .Values.sicomCrawler.schedule | quote }}
  timeZone: {{ .Values.sicomCrawler.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.sicomCrawler.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "ingestor-orchestrator.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: sicom-crawler
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: sicom-crawler
              image: {{ include "ingestor-orchestrator.image" (dict "root" . "component" "sicomCrawler") }}
              imagePullPolicy: {{ .Values.sicomCrawler.image.pullPolicy | default .Values.global.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: SICOM_ORCHESTRATOR_URL
                  value: {{ .Values.sicomCrawler.orchestratorURL | default (printf "http://%s:%v" (include "ingestor-orchestrator.fullname" .) .Values.api.service.port) | quote }}
                - name: SICOM_FORMATS
                  value: {{ .Values.sicomCrawler.formats | quote }}
                - name: IGGY_ADDRESS
                  value: {{ .Values.iggy.address | quote }}
                - name: IGGY_USERNAME
                  value: {{ .Values.iggy.username | quote }}
                - name: IGGY_STREAM
                  value: {{ .Values.iggy.stream | quote }}
                - name: IGGY_TOPIC
                  value: {{ .Values.iggy.topic | quote }}
                - name: IGGY_TOPIC_RESULTS
                  value: {{ .Values.iggy.topicResults | quote }}
                - name: S3_ENDPOINT
                  value: {{ .Values.ducklake.dataPath.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.ducklake.dataPath.bucket | quote }}
                - name: S3_USE_SSL
                  value: {{ .Values.ducklake.dataPath.useSsl | quote }}
                - name: S3_URL_STYLE
                  value: {{ .Values.ducklake.dataPath.urlStyle | quote }}
                - name: S3_PUBLIC_URL
                  value: {{ .Values.sicomCrawler.publicURL | quote }}
                - name: TMPDIR
                  value: /tmp
                - name: LIGHTPANDA_DISABLE_TELEMETRY
                  value: "true"
                {{- with .Values.sicomCrawler.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              envFrom:
                - secretRef:
                    name: {{ include "ingestor-orchestrator.secretName" . }}
              resources:
                {{- toYaml .Values.sicomCrawler.resources | nindent 16 }}
              volumeMounts:
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: temporary
              emptyDir:
                sizeLimit: {{ .Values.sicomCrawler.tempStorage | quote }}
{{- end }}
