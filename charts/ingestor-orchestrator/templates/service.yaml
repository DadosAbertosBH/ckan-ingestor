{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ingestor-orchestrator.fullname" . }}
  labels:
    {{- include "ingestor-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.api.service.goPort }}
      targetPort: go-http
      protocol: TCP
      name: go-http
  selector:
    {{- include "ingestor-orchestrator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
