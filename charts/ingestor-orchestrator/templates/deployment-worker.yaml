{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingestor-orchestrator.fullname" . }}-worker
  labels:
    {{- include "ingestor-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ingestor-orchestrator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "ingestor-orchestrator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "ingestor-orchestrator.image" (dict "root" . "component" "worker") }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy | default .Values.global.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            - name: KAFKA_TOPIC_RETRY
              value: {{ .Values.kafka.topicRetry | quote }}
            - name: KAFKA_GROUP_ID
              value: {{ .Values.kafka.groupId | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.ducklake.dataPath.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.ducklake.dataPath.bucket | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.ducklake.dataPath.useSsl | quote }}
            - name: S3_URL_STYLE
              value: {{ .Values.ducklake.dataPath.urlStyle | quote }}
            {{- include "ingestor-orchestrator.cnpgDucklakeEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "ingestor-orchestrator.fullname" . }}
            - secretRef:
                name: {{ include "ingestor-orchestrator.secretName" . }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
