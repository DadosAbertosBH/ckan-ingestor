{{- if .Values.sourceSyncWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingestor-orchestrator.fullname" . }}-source-sync-worker
  labels:
    {{- include "ingestor-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: source-sync-worker
spec:
  replicas: {{ .Values.sourceSyncWorker.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ingestor-orchestrator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: source-sync-worker
  template:
    metadata:
      labels:
        {{- include "ingestor-orchestrator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: source-sync-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: source-sync-worker
          image: {{ include "ingestor-orchestrator.image" (dict "root" . "component" "sourceSyncWorker") }}
          imagePullPolicy: {{ .Values.sourceSyncWorker.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: IGGY_ADDRESS
              value: {{ .Values.iggy.address | quote }}
            - name: IGGY_USERNAME
              value: {{ .Values.iggy.username | quote }}
            - name: IGGY_STREAM
              value: {{ .Values.iggy.stream | quote }}
            - name: IGGY_TOPIC
              value: {{ .Values.iggy.topic | quote }}
            - name: IGGY_TOPIC_RESULTS
              value: {{ .Values.iggy.topicResults | quote }}
            - name: IGGY_METADATA_SYNC_TOPIC
              value: {{ .Values.iggy.metadataSyncTopic | quote }}
            - name: IGGY_METADATA_SYNC_RESULT_TOPIC
              value: {{ .Values.iggy.metadataSyncResultTopic | quote }}
            - name: IGGY_METADATA_SYNC_GROUP_ID
              value: {{ .Values.sourceSyncWorker.groupId | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.ducklake.dataPath.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.ducklake.dataPath.bucket | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.ducklake.dataPath.useSsl | quote }}
            - name: S3_URL_STYLE
              value: {{ .Values.ducklake.dataPath.urlStyle | quote }}
            - name: S3_PUBLIC_URL
              value: {{ .Values.sourceSyncWorker.publicURL | quote }}
            - name: SICOM_FORMATS
              value: {{ .Values.sourceSyncWorker.formats | quote }}
            - name: TMPDIR
              value: /tmp
            {{- with .Values.sourceSyncWorker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "ingestor-orchestrator.fullname" . }}
            - secretRef:
                name: {{ include "ingestor-orchestrator.secretName" . }}
          resources:
            {{- toYaml .Values.sourceSyncWorker.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.oracle.walletSecretName }}
            - name: oracle-wallet
              mountPath: {{ .Values.oracle.walletMountPath }}
              readOnly: true
            {{- end }}
            - name: temporary
              mountPath: /tmp
      volumes:
        {{- if .Values.oracle.walletSecretName }}
        - name: oracle-wallet
          secret:
            secretName: {{ .Values.oracle.walletSecretName }}
        {{- end }}
        - name: temporary
          emptyDir:
            sizeLimit: {{ .Values.sourceSyncWorker.tempStorage | quote }}
{{- end }}
