{{- if .Values.scheduler.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ingestor-orchestrator.fullname" . }}-scheduler
  labels:
    {{- include "ingestor-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  schedule: {{ .Values.scheduler.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "ingestor-orchestrator.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: scheduler
        spec:
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: Never
          containers:
            - name: scheduler
              image: {{ include "ingestor-orchestrator.image" (dict "root" . "component" "scheduler") }}
              imagePullPolicy: {{ .Values.scheduler.image.pullPolicy | default .Values.global.image.pullPolicy }}
              command: ["python", "-m", "ingestor_orchestrator.services.scheduler"]
              envFrom:
                - configMapRef:
                    name: {{ include "ingestor-orchestrator.fullname" . }}
                - secretRef:
                    name: {{ include "ingestor-orchestrator.secretName" . }}
                {{- if .Values.mysql.passwordSecretRef }}
              env:
                - name: INGEST_ORCH_MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.mysql.passwordSecretRef }}
                      key: password
                {{- end }}
              resources:
                {{- toYaml .Values.scheduler.resources | nindent 16 }}
{{- end }}
