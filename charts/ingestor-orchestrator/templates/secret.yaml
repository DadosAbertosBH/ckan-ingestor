{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ingestor-orchestrator.fullname" . }}
  labels:
    {{- include "ingestor-orchestrator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.mysql.password }}
  INGEST_ORCH_MYSQL_PASSWORD: {{ .Values.mysql.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.ducklake.catalogUri }}
  DUCKLAKE_CATALOG_URI: {{ .Values.ducklake.catalogUri | b64enc | quote }}
  {{- end }}
  {{- if .Values.ducklake.dataPath.accessKeyId }}
  DUCKLAKE_DATA_PATH__ACCESS_KEY_ID: {{ .Values.ducklake.dataPath.accessKeyId | b64enc | quote }}
  {{- end }}
  {{- if .Values.ducklake.dataPath.secretAccessKey }}
  DUCKLAKE_DATA_PATH__SECRET_ACCESS_KEY: {{ .Values.ducklake.dataPath.secretAccessKey | b64enc | quote }}
  {{- end }}
{{- end }}
