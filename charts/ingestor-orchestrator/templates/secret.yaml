{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ingestor-orchestrator.fullname" . }}
  labels:
    {{- include "ingestor-orchestrator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.mysql.password }}
  INGEST_ORCH_MYSQL_PASSWORD: {{ .Values.mysql.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.iggy.password }}
  INGEST_ORCH_IGGY_PASSWORD: {{ .Values.iggy.password | b64enc | quote }}
  IGGY_PASSWORD: {{ .Values.iggy.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.ducklake.catalogUri }}
  DUCKLAKE_CATALOG_URI: {{ .Values.ducklake.catalogUri | b64enc | quote }}
  {{- end }}
  {{- if .Values.ducklake.dataPath.accessKeyId }}
  DUCKLAKE_DATA_PATH__ACCESS_KEY_ID: {{ .Values.ducklake.dataPath.accessKeyId | b64enc | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.ducklake.dataPath.accessKeyId | b64enc | quote }}
  {{- end }}
  {{- if .Values.ducklake.dataPath.secretAccessKey }}
  DUCKLAKE_DATA_PATH__SECRET_ACCESS_KEY: {{ .Values.ducklake.dataPath.secretAccessKey | b64enc | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.ducklake.dataPath.secretAccessKey | b64enc | quote }}
  {{- end }}
  {{- if and .Values.postgres.backup.enabled .Values.postgres.backup.s3Credentials.accessKeyId }}
  INGEST_ORCH_BACKUP_ACCESS_KEY_ID: {{ .Values.postgres.backup.s3Credentials.accessKeyId | b64enc | quote }}
  {{- end }}
  {{- if and .Values.postgres.backup.enabled .Values.postgres.backup.s3Credentials.secretAccessKey }}
  INGEST_ORCH_BACKUP_SECRET_ACCESS_KEY: {{ .Values.postgres.backup.s3Credentials.secretAccessKey | b64enc | quote }}
  {{- end }}
{{- end }}
