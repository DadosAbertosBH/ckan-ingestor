# -- Global settings applied to all components
global:
  image:
    registry: registry.gitlab.com/pedalin/ckan-ingestor
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  security:
    allowInsecureImages: true

# -- API server configuration
api:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    repository: ingestor-orchestrator
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 1000m
      memory: 3Gi
    limits:
      cpu: 1000m
      memory: 3Gi
  service:
    type: ClusterIP
    port: 8000
  # -- Health check configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

# -- Worker configuration
worker:
  enabled: true
  replicaCount: 2
  # -- Maximum number of messages processed in parallel across all partitions.
  # Ordering is preserved within each partition.
  concurrency: 4
  image:
    registry: ""
    repository: ingestor-orchestrator
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: 500m
      memory: 4Gi

# -- Kafka configuration
kafka:
  bootstrapServers: "kafka:9092"
  topic: "ckan.ingest.jobs"
  topicRetry: "ckan.ingest.jobs.retry"
  groupId: "ckan-worker"
  topics:
    # -- Create KafkaTopics via Strimzi. Disable if topics are managed elsewhere.
    autocreate: false
  # -- Strimzi Kafka cluster name for topic creation
  clusterName: "ingestor-kafka"

# -- PostgreSQL configuration (CloudNativePG)
postgres:
  # -- Deploy PostgreSQL via CloudNativePG operator. If false, uses external.
  deploy: false
  instances: 1
  storage:
    size: "50Gi"
    storageClass: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # -- Backup configuration (CloudNativePG barmanObjectStore)
  backup:
    # -- Enable backup via barmanObjectStore (S3-compatible)
    enabled: false
    # -- S3 destination path (e.g. s3://bucket/prefix)
    destinationPath: ""
    # -- S3 endpoint URL
    endpointURL: ""
    # -- S3 credentials (stored in secret)
    s3Credentials:
      accessKeyId: ""
      secretAccessKey: ""
    # -- Backup retention policy (e.g. "30d", "7d", "2w")
    retentionPolicy: "30d"
    # -- WAL compression algorithm
    walCompression: "gzip"
    # -- Data compression algorithm
    dataCompression: "gzip"
    # -- Cron schedule for automated backups (leave empty to disable scheduled backups)
    schedule: ""

# -- MySQL configuration (external, not deployed by this chart)
mysql:
  host: "mysql"
  port: 3306
  user: "ckan_admin"
  database: "ingestor_orchestrator"

# -- DuckLake configuration
ducklake:
  catalogUri: ""
  dataPath:
    accessKeyId: ""
    endpoint: ""
    bucket: "public-datasets"
    secretAccessKey: ""
    urlStyle: "path"

# -- Existing secret name for sensitive values (if set, skips creating a new secret)
existingSecret: ""

# -- Debug mode
debug: false
