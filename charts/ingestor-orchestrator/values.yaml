# -- Global settings applied to all components
global:
  image:
    registry: registry.gitlab.com/pedalin/ckan-ingestor
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  security:
    allowInsecureImages: true

# -- API server configuration
api:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    repository: ingestor-orchestrator
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  # -- Health check configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

# -- Worker configuration
worker:
  enabled: true
  replicaCount: 2
  # -- Maximum number of messages processed in parallel across all partitions.
  # Ordering is preserved within each partition.
  concurrency: 10
  image:
    registry: ""
    repository: ingestor-orchestrator
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# -- Scheduler configuration (runs as a CronJob)
scheduler:
  enabled: true
  schedule: "0 */8 * * *" # Every 8 hours
  image:
    registry: ""
    repository: ingestor-orchestrator
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Kafka configuration
kafka:
  # -- Deploy Kafka via Strimzi operator. If false, uses external Kafka.
  deploy: false
  bootstrapServers: "kafka:9092"
  topic: "ckan.ingest.jobs"
  topicRetry: "ckan.ingest.jobs.retry"
  groupId: "ckan-worker"
  # -- Strimzi Kafka cluster config (only used when deploy: true)
  strimzi:
    version: "4.2.0"
    replicas: 3
    storage:
      type: "ephemeral"
      # -- Size is required when type is persistent-claim
      size: "10Gi"
    resources:
      requests:
        memory: "2Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

# -- MySQL configuration (external, not deployed by this chart)
mysql:
  host: "mysql"
  port: 3306
  user: "root"
  database: "ingestor_orchestrator"
  # password is provided via secret

# -- DuckLake configuration
ducklake:
  catalogUri: ""
  dataPath:
    accessKeyId: ""
    endpoint: ""
    bucket: "public-datasets"
    secretAccessKey: ""
    urlStyle: "path"

# -- Existing secret name for sensitive values (if set, skips creating a new secret)
existingSecret: ""

# -- Debug mode
debug: false
