# -- Global settings applied to all components
global:
  image:
    registry: registry.gitlab.com/pedalin/ckan-ingestor
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  security:
    allowInsecureImages: true

# -- API server configuration
api:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    repository: ingestor-orchestrator
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8000
  # -- Health check configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

# -- Worker configuration
worker:
  enabled: true
  replicaCount: 2
  image:
    registry: ""
    repository: worker
    tag: ""
    pullPolicy: ""
  extraEnv: []
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      memory: 4Gi

# -- Metadata and Iggy topology coordinator configuration
workerCoordinator:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    repository: worker-coordinator
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi

# -- Include SICOM in bulk and scheduled syncs. Individual manual syncs are always available.
sicom:
  enabled: false

# -- Source discovery and catalog worker for CKAN and SICOM.
sourceSyncWorker:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    repository: source-sync-worker
    tag: ""
    pullPolicy: ""
  groupId: source-sync-worker
  publicURL: ""
  formats: "CSV,JSON,GEOJSON"
  tempStorage: 100Gi
  extraEnv: []
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: 10Gi
    limits:
      memory: 2Gi
      ephemeral-storage: 100Gi

# -- Apache Iggy configuration
iggy:
  # -- Deploy Apache Iggy using the official chart dependency.
  enabled: true
  fullnameOverride: iggy
  imagePullSecrets:
    - name: gitlab-registry-pull

  server:
    enabled: true
    replicaCount: 1
    # A single broker owns this PVC; replace it after the old process exits.
    strategy:
      type: Recreate
    image:
      repository: registry.gitlab.com/pedalin/ckan-ingestor/iggy
      tag: "session-recovery-d2f97066@sha256:1ca2a60db33b3d75cb0200d02b711fc252c2bb2856bf49a33896b8e9f169bedd"
      pullPolicy: IfNotPresent
    users:
      root:
        createSecret: false
        existingSecret:
          name: ingestor-orchestrator-csi
          usernameKey: IGGY_USERNAME
          passwordKey: IGGY_PASSWORD
    persistence:
      enabled: true
      existingClaim: iggy-data-v090
    env:
      - name: RUST_LOG
        value: info
      - name: IGGY_HTTP_ADDRESS
        value: "0.0.0.0:3000"
      - name: IGGY_TCP_ADDRESS
        value: "0.0.0.0:8090"
      - name: IGGY_QUIC_ADDRESS
        value: "0.0.0.0:8080"
      - name: IGGY_WEBSOCKET_ADDRESS
        value: "0.0.0.0:8092"
      - name: IGGY_PATH
        value: /app/local_data
      - name: IGGY_SHARDING_CPU_ALLOCATION
        value: all
      - name: IGGY_HEARTBEAT_ENABLED
        value: "true"
      - name: IGGY_HEARTBEAT_INTERVAL
        value: "5s"
      - name: IGGY_CONSUMER_GROUP_HEARTBEAT_INTERVAL
        value: "2s"
      - name: IGGY_CONSUMER_GROUP_SESSION_TIMEOUT
        value: "30s"

  ui:
    enabled: true

  securityContext:
    capabilities:
      add:
        - IPC_LOCK
        - SYS_NICE

  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 1Gi

  # Connection settings consumed by the API and worker.
  address: "iggy:8090"
  username: "iggy"
  password: ""
  stream: "ckan-ingestor"
  topic: "jobs"
  topicRetry: "jobs-retry"
  topicResults: "job-results"
  metadataSyncTopic: "ckan_metadata_sync"
  metadataSyncResultTopic: "ckan_metadata_sync_result"
  groupId: "ckan-worker"
  metadataSyncGroupId: "ckan-metadata-sync-worker"
  resultGroupId: "ckan-result-consumer"
  metadataSyncResultGroupId: "ckan-metadata-sync-result-consumer"
  jobPartitions: 10
  retryPartitions: 10
  resultPartitions: 1

# -- PostgreSQL configuration (CloudNativePG)
postgres:
  # -- Deploy PostgreSQL via CloudNativePG operator. If false, uses external.
  deploy: false
  instances: 1
  # -- Additional CloudNativePG read-write Service configuration.
  service:
    annotations: {}
  storage:
    size: "10Gi"
    storageClass: ""
  # -- Bootstrap configuration. When recovery.backupName is set, the cluster
  #    bootstraps from that backup (CloudNativePG bootstrap.recovery); leave
  #    empty for the default initdb bootstrap.
  bootstrap:
    recovery:
      backupName: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
  # -- Backup configuration (CloudNativePG barmanObjectStore)
  backup:
    # -- Enable backup via barmanObjectStore (S3-compatible)
    enabled: false
    # -- Barman server name (defaults to the cluster name if empty)
    serverName: ""
    # -- S3 destination path (e.g. s3://bucket/prefix)
    destinationPath: ""
    # -- S3 endpoint URL
    endpointURL: ""
    # -- S3 credentials (stored in secret)
    s3Credentials:
      accessKeyId: ""
      secretAccessKey: ""
    # -- Backup retention policy (e.g. "30d", "7d", "2w")
    retentionPolicy: "30d"
    # -- WAL compression algorithm
    walCompression: "gzip"
    # -- Data compression algorithm
    dataCompression: "gzip"
    # -- Cron schedule for automated backups (leave empty to disable scheduled backups)
    schedule: ""

# -- Database provider shared by API, migrations and source sync worker.
database:
  provider: oracle

# -- Oracle configuration (external Autonomous database).
oracle:
  dsn: ""
  walletSecretName: ""
  walletMountPath: /oracle-wallet

# -- MySQL configuration (external, not deployed by this chart)
mysql:
  host: "mysql"
  port: 3306
  user: "ckan_admin"
  database: "ingestor_orchestrator"

# -- DuckLake configuration
ducklake:
  catalogUri: ""
  database: ":memory:"
  dataPath:
    accessKeyId: ""
    endpoint: ""
    bucket: "public-datasets"
    secretAccessKey: ""
    urlStyle: "path"
    useSsl: "false"

# -- Existing secret name for sensitive values (if set, skips creating a new secret)
existingSecret: ""

# -- Debug mode
debug: false
