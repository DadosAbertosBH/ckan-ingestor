# -- Global settings applied to all components
global:
  image:
    registry: registry.gitlab.com/pedalin/ckan-ingestor
    tag: latest
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  security:
    allowInsecureImages: true

# -- API server configuration
api:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    repository: ingestor-orchestrator
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8000
  # -- Health check configuration
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

# -- Worker configuration
worker:
  enabled: true
  replicaCount: 2
  image:
    registry: ""
    repository: worker
    tag: ""
    pullPolicy: ""
  extraEnv: []
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      memory: 4Gi

# -- Metadata and Iggy topology coordinator configuration
workerCoordinator:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    repository: worker-coordinator
    tag: ""
    pullPolicy: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi

# -- Apache Iggy configuration
iggy:
  # -- Deploy Apache Iggy using the official chart dependency.
  enabled: true
  fullnameOverride: iggy

  server:
    enabled: true
    replicaCount: 1
    image:
      repository: apache/iggy
      tag: "0.9.0"
      pullPolicy: IfNotPresent
    users:
      root:
        createSecret: false
        existingSecret:
          name: ingestor-orchestrator-csi
          usernameKey: IGGY_USERNAME
          passwordKey: IGGY_PASSWORD
    persistence:
      enabled: true
      existingClaim: iggy-data-v090
    env:
      - name: RUST_LOG
        value: info
      - name: IGGY_HTTP_ADDRESS
        value: "0.0.0.0:3000"
      - name: IGGY_TCP_ADDRESS
        value: "0.0.0.0:8090"
      - name: IGGY_QUIC_ADDRESS
        value: "0.0.0.0:8080"
      - name: IGGY_WEBSOCKET_ADDRESS
        value: "0.0.0.0:8092"
      - name: IGGY_PATH
        value: /app/local_data
      - name: IGGY_SHARDING_CPU_ALLOCATION
        value: all

  ui:
    enabled: true

  securityContext:
    capabilities:
      add:
        - IPC_LOCK
        - SYS_NICE

  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 1Gi

  # Connection settings consumed by the API and worker.
  address: "iggy:8090"
  username: "iggy"
  password: ""
  stream: "ckan-ingestor"
  topic: "jobs"
  topicRetry: "jobs-retry"
  topicResults: "job-results"
  metadataSyncTopic: "ckan_metadata_sync"
  metadataSyncResultTopic: "ckan_metadata_sync_result"
  groupId: "ckan-worker"
  metadataSyncGroupId: "ckan-metadata-sync-worker"
  resultGroupId: "ckan-result-consumer"
  metadataSyncResultGroupId: "ckan-metadata-sync-result-consumer"
  jobPartitions: 10
  retryPartitions: 10
  resultPartitions: 1

# -- PostgreSQL configuration (CloudNativePG)
postgres:
  # -- Deploy PostgreSQL via CloudNativePG operator. If false, uses external.
  deploy: false
  instances: 1
  # -- Additional CloudNativePG read-write Service configuration.
  service:
    annotations: {}
  storage:
    size: "50Gi"
    storageClass: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
  # -- Backup configuration (CloudNativePG barmanObjectStore)
  backup:
    # -- Enable backup via barmanObjectStore (S3-compatible)
    enabled: false
    # -- S3 destination path (e.g. s3://bucket/prefix)
    destinationPath: ""
    # -- S3 endpoint URL
    endpointURL: ""
    # -- S3 credentials (stored in secret)
    s3Credentials:
      accessKeyId: ""
      secretAccessKey: ""
    # -- Backup retention policy (e.g. "30d", "7d", "2w")
    retentionPolicy: "30d"
    # -- WAL compression algorithm
    walCompression: "gzip"
    # -- Data compression algorithm
    dataCompression: "gzip"
    # -- Cron schedule for automated backups (leave empty to disable scheduled backups)
    schedule: ""

# -- MySQL configuration (external, not deployed by this chart)
mysql:
  host: "mysql"
  port: 3306
  user: "ckan_admin"
  database: "ingestor_orchestrator"

# -- DuckLake configuration
ducklake:
  catalogUri: ""
  database: ":memory:"
  dataPath:
    accessKeyId: ""
    endpoint: ""
    bucket: "public-datasets"
    secretAccessKey: ""
    urlStyle: "path"
    useSsl: "false"

# -- Existing secret name for sensitive values (if set, skips creating a new secret)
existingSecret: ""

# -- Debug mode
debug: false
