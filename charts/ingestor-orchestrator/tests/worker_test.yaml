suite: Worker deployment (Rust)
templates:
  - deployment-worker.yaml
tests:
  - it: uses the Rust worker image
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "/worker:"

  - it: injects Apache Iggy configuration
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IGGY_ADDRESS
            value: "iggy:8090"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IGGY_TOPIC
            value: "jobs"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IGGY_TOPIC_RETRY
            value: "jobs-retry"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IGGY_TOPIC_RESULTS
            value: "job-results"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IGGY_GROUP_ID
            value: "ckan-worker"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: IGGY_PARTITIONS
            value: "10"

  - it: injects S3 configuration
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_BUCKET
            value: "public-datasets"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: S3_USE_SSL
            value: "false"

  - it: does not override the image entrypoint
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: injects additional worker environment variables
    set:
      worker.extraEnv:
        - name: RAYON_NUM_THREADS
          value: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RAYON_NUM_THREADS
            value: ""
