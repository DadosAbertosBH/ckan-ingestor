suite: PostgreSQL via CloudNativePG
templates:
  - postgres.yaml
tests:
  - it: should not render CNPG Cluster by default
    asserts:
      - hasDocuments:
          count: 0
        template: postgres.yaml

  - it: should render CNPG Cluster when deploy is true
    set:
      postgres.deploy: true
      postgres.service.annotations.tailscale\.com/expose: "true"
    asserts:
      - hasDocuments:
          count: 1
        template: postgres.yaml
      - isKind:
          of: Cluster
        template: postgres.yaml
      - matchRegex:
          path: apiVersion
          pattern: postgresql.cnpg.io
      - equal:
          path: spec.instances
          value: 1
      - equal:
          path: spec.resources.limits.memory
          value: 1Gi
      - equal:
          path: spec.managed.services.additional[0].serviceTemplate.metadata.name
          value: RELEASE-NAME-ingestor-orchestrator-postgres-tailscale
      - equal:
          path: spec.managed.services.additional[0].serviceTemplate.metadata.annotations["tailscale.com/expose"]
          value: "true"
      - equal:
          path: spec.managed.services.additional[0].selectorType
          value: rw
