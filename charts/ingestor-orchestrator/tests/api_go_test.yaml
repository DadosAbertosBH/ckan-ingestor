suite: Go API deployment
templates:
  - deployment-api.yaml
  - service.yaml
  - configmap.yaml
tests:
  - it: exposes one Go API and runs Go migrations
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: go-migrate
        template: deployment-api.yaml
      - equal:
          path: spec.template.spec.initContainers[0].args[0]
          value: migrate
        template: deployment-api.yaml
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: go-http
            containerPort: 8081
            protocol: TCP
        template: deployment-api.yaml
      - notExists:
          path: spec.template.spec.containers[0].command
        template: deployment-api.yaml
      - notContains:
          path: spec.ports
          content:
            port: 8081
            targetPort: go-http
            protocol: TCP
            name: go-http
        template: service.yaml
      - notExists:
          path: data.INGEST_ORCH_GO_API_URL
        template: configmap.yaml
