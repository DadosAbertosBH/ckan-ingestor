suite: Kafka topic autocreate
templates:
  - kafka-topics.yaml
tests:
  - it: should not create topics by default
    asserts:
      - hasDocuments:
          count: 0
        template: kafka-topics.yaml

  - it: should create topics when autocreate is true
    set:
      kafka.topics.autocreate: true
    asserts:
      - hasDocuments:
          count: 2
        template: kafka-topics.yaml
      - containsDocument:
          kind: KafkaTopic
          apiVersion: kafka.strimzi.io/v1
        template: kafka-topics.yaml
