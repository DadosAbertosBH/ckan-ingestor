suite: Kafka topic autocreate
templates:
  - kafka-topics.yaml
tests:
  - it: should not create topics by default
    asserts:
      - hasDocuments:
          count: 0
        template: kafka-topics.yaml

  - it: should create topics when autocreate is true
    set:
      kafka.topics.autocreate: true
    asserts:
      - hasDocuments:
          count: 2
        template: kafka-topics.yaml
      - containsDocument:
          kind: KafkaTopic
          apiVersion: kafka.strimzi.io/v1
        template: kafka-topics.yaml

  - it: should use the configured partitions for the primary topic
    set:
      kafka.topics.autocreate: true
      kafka.partitions: 6
    asserts:
      - equal:
          path: spec.partitions
          value: 6
        documentIndex: 0
        template: kafka-topics.yaml

  - it: uses a default of 3 partitions when not configured
    set:
      kafka.topics.autocreate: true
    asserts:
      - equal:
          path: spec.partitions
          value: 3
        documentIndex: 0
        template: kafka-topics.yaml
