image: docker

stages:
  - prepare
  - lint
  - test
  - build

services:
  - name: docker:dind
    # explicitly disable tls to avoid docker startup interruption
    command: ["--tls=false"]

variables:
  # Immutable builder tag. Bump this together with Dockerfile.builder.dev so
  # the prepare job publishes a new image while ordinary Rust jobs reuse cache.
  CKAN_BUILDER_IMAGE: "$CI_REGISTRY_IMAGE/ckan-builder-dev:nightly-2026-07-01-v2"
  # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
  DOCKER_HOST: "tcp://docker:2375"
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2

license-check:
  stage: lint
  image: alpine:latest
  script:
    - |
      missing=0
      for f in $(find . \( -name '*.py' -o -name '*.rs' -o -name '*.go' \) \
          -not -path './.venv/*' \
          -not -path '*/site-packages/*' \
          -not -path '*/.venv/*' \
          -not -path './env/*' \
          -not -path '*/target/*' \
          -not -path '*/.cargo/*'); do
        if ! grep -qi 'GNU AFFERO' "$f"; then
          echo "MISSING LICENSE HEADER: $f"
          missing=1
        fi
      done
      if [ "$missing" -eq 1 ]; then
        echo ""
        echo "Run ./add_license.sh to add missing headers."
        exit 1
      fi
      echo "All files have AGPL license headers."

build-ckan-builder-dev:
  stage: prepare
  image: docker
  tags:
    - noctcloud-k8s
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker context create builder
    - docker buildx create builder --use
    - |
      docker buildx build \
        --platform linux/arm64 \
        --tag $CKAN_BUILDER_IMAGE \
        --tag $CI_REGISTRY_IMAGE/ckan-builder-dev:$CI_COMMIT_SHORT_SHA \
        --file ckan-ingestor-rs/Dockerfile.builder.dev \
        --push .
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        - "ckan-ingestor-rs/Dockerfile.builder.dev"

test-go:
  stage: test
  image: golang:1.26-bookworm
  services:
    - name: mysql:8.0
  variables:
    GOCACHE: "$CI_PROJECT_DIR/.go-cache"
    GOMODCACHE: "$CI_PROJECT_DIR/.go-mod-cache"
    MYSQL_ROOT_PASSWORD: "integration-test"
    MYSQL_DATABASE: "orchestrator_test"
    INGEST_ORCH_MYSQL_HOST: "mysql"
    INGEST_ORCH_DB_PROVIDER: "mysql"
    INGEST_ORCH_MYSQL_PASSWORD: "integration-test"
    INGEST_ORCH_MYSQL_DATABASE: "orchestrator_test"
    MYSQL_INTEGRATION_DSN: "root:integration-test@tcp(mysql:3306)/orchestrator_test?parseTime=true&loc=UTC"
  cache:
    - key:
        files:
          - ingestor_orchestrator/backend/go.sum
      paths:
        - .go-cache/
        - .go-mod-cache/
  script:
    - cd ingestor_orchestrator/backend
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go run ./cmd/orchestrator migrate
    - go test -race -coverprofile=coverage.out ./...
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "ingestor_orchestrator/backend/**/*"
        - "ingestor_orchestrator/repository-contracts/**/*"
        - "ingestor_orchestrator/mysql-repositories/**/*"
        - "ingestor_orchestrator/oracle-repositories/**/*"
        - "ingestor_orchestrator/Dockerfile"

test-frontend:
  stage: test
  image: node:22-bookworm-slim
  script:
    - cd ingestor_orchestrator/frontend
    - npm ci
    - npm test
    - npm run build
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "ingestor_orchestrator/frontend/**/*"

test-lake-snapshot:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  services:
    - name: postgres:16
      alias: lake-postgres
  variables:
    POSTGRES_PASSWORD: fixture
    POSTGRES_DB: postgres
    LAKE_TEST_POSTGRES_DSN: "host=lake-postgres port=5432 dbname=postgres user=postgres password=fixture"
  script:
    - apt-get update && apt-get install -y curl
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - uv sync --frozen
    - DUCKDB_EXTENSION_DIRECTORY=/root/.duckdb/extensions uv run analytics/install_snapshot_extensions.py
    - uv run ruff check
    - uv run pytest tests/ -q
    - uv run lake-explorer/e2e/create_fixture.py
  artifacts:
    paths:
      - lake-explorer/e2e/fixtures/
    expire_in: 1 day
  rules: &lake-rules
    - if: $CI_COMMIT_TAG
    - changes:
        - "lake-explorer/**/*"
        - "analytics/**/*"
        - "tests/test_lake*"
        - "tests/test_publish_lake_snapshot.py"
        - "charts/ingestor-orchestrator/**/*"
        - ".gitlab-ci.yml"

.release-tag-rules: &release-tag-rules
  - if: $CI_COMMIT_TAG

test-lake-explorer:
  stage: test
  image: node:22-bookworm-slim
  services: []
  needs:
    - job: test-lake-snapshot
      artifacts: true
  before_script:
    - cd lake-explorer
    - corepack enable
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
    - pnpm run types
    - pnpm run check:worker
    - pnpm run check:deploy
    - pnpm exec playwright install --with-deps chromium
    - pnpm run test:e2e
  artifacts:
    when: on_failure
    paths:
      - lake-explorer/test-results/
  rules: *lake-rules

build-lake-snapshot:
  stage: build
  image: docker
  tags:
    - saas-linux-small-arm64
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - >-
      docker build
      --file analytics/Dockerfile.snapshot
      --tag "$CI_REGISTRY_IMAGE/lake-snapshot:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      .
    - docker push "$CI_REGISTRY_IMAGE/lake-snapshot:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
  rules: *release-tag-rules

test-sicom-crawler:
  stage: test
  image: golang:1.26-bookworm
  services: []
  script:
    - cd ingestor_orchestrator/sicom-crawler
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test -race -cover ./...
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "ingestor_orchestrator/sicom-crawler/**/*"
        - ".gitlab-ci.yml"

test-go-modules:
  stage: test
  image: golang:1.26-bookworm
  services: []
  script:
    - |
      for module in \
        sicom-source-identity \
        ingestor-job-message-contracts \
        iggy-message-transport \
        source-sync-message-contracts \
        source-resource-catalog \
        repository-contracts \
        mysql-repositories \
        oracle-repositories \
        ckan-source-discovery \
        source-sync-worker; do
        (
          cd "ingestor_orchestrator/$module"
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
        )
      done
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "ingestor_orchestrator/sicom-source-identity/**/*"
        - "ingestor_orchestrator/ingestor-job-message-contracts/**/*"
        - "ingestor_orchestrator/iggy-message-transport/**/*"
        - "ingestor_orchestrator/source-sync-message-contracts/**/*"
        - "ingestor_orchestrator/source-resource-catalog/**/*"
        - "ingestor_orchestrator/ckan-source-discovery/**/*"
        - "ingestor_orchestrator/source-sync-worker/**/*"
        - "ingestor_orchestrator/repository-contracts/**/*"
        - "ingestor_orchestrator/mysql-repositories/**/*"
        - "ingestor_orchestrator/oracle-repositories/**/*"
        - ".gitlab-ci.yml"

test-sicom-chart:
  stage: test
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  services: []
  script:
    - apk add --no-cache git
    - helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.5.0
    - helm unittest charts/ingestor-orchestrator -f tests/source_sync_worker_test.yaml
    - helm lint charts/ingestor-orchestrator --set sourceSyncWorker.enabled=true
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "charts/ingestor-orchestrator/**/*"
        - ".gitlab-ci.yml"

build-source-sync-worker:
  stage: build
  image: docker
  tags:
    - saas-linux-small-arm64
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - docker buildx create --use
    - |
      docker buildx build \
        --platform linux/arm64 \
        --pull \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/source-sync-worker-cache:arm64 \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/source-sync-worker-cache:arm64,mode=max \
        --tag "$CI_REGISTRY_IMAGE/source-sync-worker:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" \
        --tag "$CI_REGISTRY_IMAGE/source-sync-worker:latest" \
        --file ingestor_orchestrator/source-sync-worker/Dockerfile \
        --push .
  rules: *release-tag-rules

.rust-ci-base:
  image: $CKAN_BUILDER_IMAGE
  tags:
    - noctcloud-k8s
  variables:
    CARGO_INCREMENTAL: "0"
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
    CARGO_PROFILE_DEV_STRIP: "symbols"
    CARGO_PROFILE_TEST_STRIP: "symbols"
    # RUSTC_WRAPPER: "kache"
    KACHE_CACHE_DIR: "$CI_PROJECT_DIR/.kache"
    KACHE_RUNTIME_DIR: "$CI_PROJECT_DIR/.kache-runtime"
    KACHE_MAX_SIZE: "4G"
    CACHE_COMPRESSION_LEVEL: "fastest"
    FF_USE_PARALLEL_CACHE_TRANSFER: "false" # Breaks in R2
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
    RAYON_NUM_THREADS: "1"
  cache:
    - key:
        prefix: ckan-rust-downloads-v3
        files:
          - ckan-ingestor-rs/Cargo.lock
      paths:
        - .cargo-home/registry/index/
        - .cargo-home/registry/cache/
        - .cargo-home/git/db/
  before_script:
    - &rust-disk-usage |
      disk_usage() {
        echo "Disk usage: $1"
        df -h "$CI_PROJECT_DIR" /tmp || true
        for directory in "$CI_PROJECT_DIR/ckan-ingestor-rs/target" "$CARGO_HOME" /tmp; do
          if [ -d "$directory" ]; then
            du -sh "$directory" || true
          fi
        done
        if [ "${CI_JOB_NAME:-}" = "test-rust" ]; then
          echo "Docker disk usage (/system/df):"
          curl --fail --silent --show-error --max-time 10 \
            "http://${DOCKER_HOST#tcp://}/system/df" || true
          echo
        fi
      }
    - disk_usage "after cache restore"
    - cd ckan-ingestor-rs
  after_script:
    - *rust-disk-usage
    - disk_usage "after job"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        - "ckan-ingestor-rs/**/*"
        - ".gitlab-ci.yml"

lint-rust:
  extends: .rust-ci-base
  stage: lint
  services: []
  script:
    - cargo fmt --all -- --check
    - disk_usage "after fmt"
    - cargo clippy --all-targets -- -D warnings
    - disk_usage "after clippy"

test-rust:
  extends: .rust-ci-base
  stage: test
  variables:
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  script:
    - until curl -fsS http://docker:2375/_ping; do sleep 1; done
    - cargo test --all --no-run
    - disk_usage "after test compilation"
    # Iggy integration tests run serially against their Testcontainers instance.
    - cargo test --all -- --include-ignored --test-threads=1
    - disk_usage "after tests"

.build-orchestrator-base:
  stage: build
  image: docker
  timeout: 2h
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker context create builder
    - docker buildx create builder --use
    - |
      ARCH_TAG="$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA-$TARGET_ARCH"
      docker buildx build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/orchestrator-cache:$TARGET_ARCH \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/orchestrator-cache:$TARGET_ARCH,mode=max \
        --platform linux/$TARGET_ARCH \
        --tag "$ARCH_TAG" \
        --file ingestor_orchestrator/Dockerfile \
        --push .
  rules:
    - if: $CI_COMMIT_TAG

build-orchestrator-amd64:
  extends: .build-orchestrator-base
  variables:
    TARGET_ARCH: amd64
  tags:
    - saas-linux-medium-amd64
  # AMD64 image generation is temporarily paused.
  rules:
    - when: never

build-orchestrator-arm64:
  extends: .build-orchestrator-base
  variables:
    TARGET_ARCH: arm64
  tags:
    - saas-linux-small-arm64
  rules:
    - if: $CI_COMMIT_TAG

build-orchestrator:
  stage: build
  image: docker
  timeout: 2h
  needs:
    - build-orchestrator-arm64
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker context create builder
    - docker buildx create builder --use
    - |
      ARM64="$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA-arm64"
      docker buildx imagetools create \
        --tag "$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE/orchestrator:latest" \
        "$ARM64"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker buildx imagetools create \
          --tag "$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_TAG" \
          "$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA-arm64"
      fi
  rules:
    - if: $CI_COMMIT_TAG

.build-worker-base:
  image: docker
  stage: build
  timeout: 2h
  variables:
    WORKER_DOCKERFILE: ckan-ingestor-rs/Dockerfile
    WORKER_CONTEXT: ckan-ingestor-rs
    WORKER_IMAGE: worker
    WORKER_PACKAGE: ckan_ingestor_consumer
    WORKER_BINARY: ckan-ingestor-consumer
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker pull $CI_REGISTRY_IMAGE/$WORKER_IMAGE:latest || true
    - docker context create builder
    - docker buildx create builder --use
    - |
      ARCH_TAG="$CI_REGISTRY_IMAGE/$WORKER_IMAGE:$CI_COMMIT_SHORT_SHA-$TARGET_ARCH"
      docker buildx build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/$WORKER_IMAGE-cache:$TARGET_ARCH \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/$WORKER_IMAGE-cache:$TARGET_ARCH,mode=max \
        --build-arg WORKER_PACKAGE=$WORKER_PACKAGE \
        --build-arg WORKER_BINARY=$WORKER_BINARY \
        --platform linux/$TARGET_ARCH \
        --tag "$ARCH_TAG" \
        --file $WORKER_DOCKERFILE \
        --push $WORKER_CONTEXT
  rules: *release-tag-rules

