image: docker

stages:
  - lint
  - test
  - build

services:
  - name: docker:dind
    # explicitly disable tls to avoid docker startup interruption
    command: ["--tls=false"]

variables:
  # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
  DOCKER_HOST: "tcp://docker:2375"
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2

license-check:
  stage: lint
  image: alpine:latest
  script:
    - |
      missing=0
      for f in $(find . \( -name '*.py' -o -name '*.rs' \) \
          -not -path './.venv/*' \
          -not -path '*/site-packages/*' \
          -not -path '*/.venv/*' \
          -not -path './env/*' \
          -not -path '*/target/*' \
          -not -path '*/.cargo/*'); do
        if ! grep -qi 'GNU AFFERO' "$f"; then
          echo "MISSING LICENSE HEADER: $f"
          missing=1
        fi
      done
      if [ "$missing" -eq 1 ]; then
        echo ""
        echo "Run ./add_license.sh to add missing headers."
        exit 1
      fi
      echo "All files have AGPL license headers."

test:
  stage: test
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  variables:
    UV_VERSION: "0.5"
    UV_CACHE_DIR: .uv-cache
    PYTHON_VERSION: "3.13"
    BASE_LAYER: bookworm-slim
    # GitLab CI creates a separate mountpoint for the build directory,
    # so we need to copy instead of using hard links.
    UV_LINK_MODE: copy
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
  script:
    - uv sync
    - uv pip install -e "ingestor_orchestrator/backend"
    - uv run ruff check
    - uv run pytest
    - uv cache prune --ci
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "ingestor_orchestrator/**/*"

test-rust:
  stage: test
  image: rust:1.97.1-slim-trixie
  tags:
    - noctcloud-k8s
  variables:
    CARGO_INCREMENTAL: "0"
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
    # Force libduckdb-sys to download the prebuilt DuckDB library so that
    # tests and builds can link against it on Linux runners.
    DUCKDB_DOWNLOAD_LIB: "1"
    CARGO_HOME: .cargo-home
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
  cache:
    - key:
        files:
          - ckan-ingestor-rs/Cargo.lock
      paths:
        - $CARGO_HOME
  script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential cmake curl libssl-dev libcurl4-openssl-dev pkg-config && rm -rf /var/lib/apt/lists/*
    - until curl -fsS http://docker:2375/_ping; do sleep 1; done
    - rustup component add rustfmt clippy
    - cd ckan-ingestor-rs
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test --all --no-run
    # Iggy integration tests run serially against their Testcontainers instance.
    - cargo test --all -- --include-ignored --test-threads=1
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "ckan-ingestor-rs/**/*"

.build-orchestrator-base:
  stage: build
  image: docker
  timeout: 2h
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker context create builder
    - docker buildx create builder --use
    - |
      ARCH_TAG="$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA-$TARGET_ARCH"
      docker buildx build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/orchestrator-cache:$TARGET_ARCH \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/orchestrator-cache:$TARGET_ARCH,mode=max \
        --platform linux/$TARGET_ARCH \
        --tag "$ARCH_TAG" \
        --file ingestor_orchestrator/Dockerfile \
        --push .
  rules:
    - if: $CI_COMMIT_TAG

build-orchestrator-amd64:
  extends: .build-orchestrator-base
  variables:
    TARGET_ARCH: amd64
  tags:
    - saas-linux-medium-amd64

build-orchestrator-arm64:
  extends: .build-orchestrator-base
  variables:
    TARGET_ARCH: arm64
  tags:
    - saas-linux-small-arm64

build-orchestrator:
  stage: build
  image: docker
  timeout: 2h
  needs:
    - build-orchestrator-amd64
    - build-orchestrator-arm64
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker context create builder
    - docker buildx create builder --use
    - |
      AMD64="$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA-amd64"
      ARM64="$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA-arm64"
      docker buildx imagetools create \
        --tag "$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE/orchestrator:latest" \
        "$AMD64" \
        "$ARM64"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker buildx imagetools create \
          --tag "$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_TAG" \
          "$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA-amd64" \
          "$CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA-arm64"
      fi
  rules:
    - if: $CI_COMMIT_TAG

.build-worker-base:
  image: docker
  stage: build
  timeout: 2h
  variables:
    WORKER_DOCKERFILE: ckan-ingestor-rs/Dockerfile
    WORKER_CONTEXT: ckan-ingestor-rs
    WORKER_IMAGE: worker
    WORKER_PACKAGE: ckan_ingestor_consumer
    WORKER_BINARY: ckan-ingestor-consumer
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker pull $CI_REGISTRY_IMAGE/$WORKER_IMAGE:latest || true
    - docker context create builder
    - docker buildx create builder --use
    - |
      ARCH_TAG="$CI_REGISTRY_IMAGE/$WORKER_IMAGE:$CI_COMMIT_SHORT_SHA-$TARGET_ARCH"
      docker buildx build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/$WORKER_IMAGE-cache:$TARGET_ARCH \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/$WORKER_IMAGE-cache:$TARGET_ARCH,mode=max \
        --build-arg WORKER_PACKAGE=$WORKER_PACKAGE \
        --build-arg WORKER_BINARY=$WORKER_BINARY \
        --platform linux/$TARGET_ARCH \
        --tag "$ARCH_TAG" \
        --file $WORKER_DOCKERFILE \
        --push $WORKER_CONTEXT
  rules:
    - if: $CI_COMMIT_TAG

build-worker-amd64:
  extends: .build-worker-base
  variables:
    TARGET_ARCH: amd64
  tags:
    - saas-linux-medium-amd64

build-worker-arm64:
  extends: .build-worker-base
  variables:
    TARGET_ARCH: arm64
  tags:
    - saas-linux-small-arm64

build-worker:
  stage: build
  timeout: 2h
  needs:
    - build-worker-amd64
    - build-worker-arm64
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker context create builder
    - docker buildx create builder --use
    - |
      AMD64="$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA-amd64"
      ARM64="$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA-arm64"
      docker buildx imagetools create \
        --tag "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE/worker:latest" \
        "$AMD64" \
        "$ARM64"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker buildx imagetools create \
          --tag "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_TAG" \
          "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA-amd64" \
          "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA-arm64"
      fi
  rules:
    - if: $CI_COMMIT_TAG

build-worker-coordinator-amd64:
  extends: .build-worker-base
  variables:
    TARGET_ARCH: amd64
    WORKER_IMAGE: worker-coordinator
    WORKER_PACKAGE: ckan_worker_coordinator
    WORKER_BINARY: ckan-worker-coordinator
  tags:
    - saas-linux-medium-amd64

build-worker-coordinator-arm64:
  extends: .build-worker-base
  variables:
    TARGET_ARCH: arm64
    WORKER_IMAGE: worker-coordinator
    WORKER_PACKAGE: ckan_worker_coordinator
    WORKER_BINARY: ckan-worker-coordinator
  tags:
    - saas-linux-small-arm64

build-worker-coordinator:
  stage: build
  timeout: 2h
  needs:
    - build-worker-coordinator-amd64
    - build-worker-coordinator-arm64
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker context create builder
    - docker buildx create builder --use
    - |
      AMD64="$CI_REGISTRY_IMAGE/worker-coordinator:$CI_COMMIT_SHORT_SHA-amd64"
      ARM64="$CI_REGISTRY_IMAGE/worker-coordinator:$CI_COMMIT_SHORT_SHA-arm64"
      docker buildx imagetools create \
        --tag "$CI_REGISTRY_IMAGE/worker-coordinator:$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE/worker-coordinator:latest" \
        "$AMD64" \
        "$ARM64"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker buildx imagetools create \
          --tag "$CI_REGISTRY_IMAGE/worker-coordinator:$CI_COMMIT_TAG" \
          "$CI_REGISTRY_IMAGE/worker-coordinator:$CI_COMMIT_SHORT_SHA-amd64" \
          "$CI_REGISTRY_IMAGE/worker-coordinator:$CI_COMMIT_SHORT_SHA-arm64"
      fi
  rules:
    - if: $CI_COMMIT_TAG
