image: docker

stages:
  - lint
  - test
  - build

services:
  - name: docker:dind
    # explicitly disable tls to avoid docker startup interruption
    command: ["--tls=false"]

variables:
  # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
  DOCKER_HOST: "tcp://docker:2375"
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2

license-check:
  stage: lint
  image: alpine:latest
  script:
    - |
      missing=0
      for f in $(find . \( -name '*.py' -o -name '*.rs' \) \
          -not -path './.venv/*' \
          -not -path '*/site-packages/*' \
          -not -path '*/.venv/*' \
          -not -path './env/*' \
          -not -path '*/target/*' \
          -not -path '*/.cargo/*'); do
        if ! grep -qi 'GNU AFFERO' "$f"; then
          echo "MISSING LICENSE HEADER: $f"
          missing=1
        fi
      done
      if [ "$missing" -eq 1 ]; then
        echo ""
        echo "Run ./add_license.sh to add missing headers."
        exit 1
      fi
      echo "All files have AGPL license headers."

test:
  stage: test
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  variables:
    UV_VERSION: "0.5"
    UV_CACHE_DIR: .uv-cache
    PYTHON_VERSION: "3.13"
    BASE_LAYER: bookworm-slim
    # GitLab CI creates a separate mountpoint for the build directory,
    # so we need to copy instead of using hard links.
    UV_LINK_MODE: copy
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
  script:
    - uv sync
    - uv pip install -e "ingestor_orchestrator/backend"
    - uv run ruff check
    - uv run pytest
    - uv cache prune --ci
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "ckan_ingestor/**/*"
        - "ingestor_orchestrator/**/*"

test-rust:
  stage: test
  image: rust:1.97.1-slim-trixie
  variables:
    # Force libduckdb-sys to download the prebuilt DuckDB library so that
    # tests and builds can link against it on Linux runners.
    DUCKDB_DOWNLOAD_LIB: "1"
    CARGO_HOME: .cargo-home
  cache:
    - key:
        files:
          - ckan-ingestor-rs/Cargo.lock
      paths:
        - $CARGO_HOME
        - ckan-ingestor-rs/target
  script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential cmake libssl-dev libcurl4-openssl-dev pkg-config && rm -rf /var/lib/apt/lists/*
    - rustup component add rustfmt clippy
    - cd ckan-ingestor-rs
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test --all
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "ckan-ingestor-rs/**/*"

build-orchestrator:
  stage: build
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker pull $CI_REGISTRY_IMAGE/orchestrator:latest || true
    - docker context create builder
    - docker buildx create builder --use
    - |
      TAG_ARGS="--tag $CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA --tag $CI_REGISTRY_IMAGE/orchestrator:latest"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_ARGS="$TAG_ARGS --tag $CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_TAG"
      fi
      docker buildx build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from $CI_REGISTRY_IMAGE/orchestrator:latest \
        --platform linux/amd64,linux/arm64 \
        $TAG_ARGS \
        --file ingestor_orchestrator/Dockerfile \
        --push .
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "ingestor_orchestrator/**/*"
        - "ckan_ingestor/**/*"

build-worker:
  stage: build
  timeout: 2h
  tags:
    - saas-linux-medium-amd64
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker pull $CI_REGISTRY_IMAGE/worker:latest || true
    - docker context create builder
    - docker buildx create builder --use
    - |
      TAG_ARGS="--tag $CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA --tag $CI_REGISTRY_IMAGE/worker:latest"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_ARGS="$TAG_ARGS --tag $CI_REGISTRY_IMAGE/worker:$CI_COMMIT_TAG"
      fi
      docker buildx build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/worker-cache:latest \
        --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/worker-cache:latest,mode=max \
        --platform linux/amd64,linux/arm64 \
        $TAG_ARGS \
        --file ckan-ingestor-rs/Dockerfile \
        --push ckan-ingestor-rs
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - "ckan-ingestor-rs/**/*"
