image: docker

stages:
  - test
  - build
  - deploy

services:
  - name: docker:dind
    # explicitly disable tls to avoid docker startup interruption
    command: ["--tls=false"]

variables:
  # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
  DOCKER_HOST: "tcp://docker:2375"
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2

test:
  stage: test
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  variables:
    UV_VERSION: "0.5"
    UV_CACHE_DIR: .uv-cache
    PYTHON_VERSION: "3.12"
    BASE_LAYER: bookworm-slim
    # GitLab CI creates a separate mountpoint for the build directory,
    # so we need to copy instead of using hard links.
    UV_LINK_MODE: copy
  before_script:
    # Ensure git is available inside the job image; try common package managers.
    - |
      if command -v git >/dev/null 2>&1; then
        echo "git already installed"
      else
        echo "installing git"
        if [ -f /etc/alpine-release ]; then
          apk add --no-cache git
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y git
        elif command -v yum >/dev/null 2>&1; then
          yum install -y git
        else
          echo "Could not detect package manager to install git" >&2
          exit 1
        fi
      fi
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
  script:
    - uv sync
    - uv run ruff check
    - uv run pytest
    - uv cache prune --ci
  rules:
    - changes:
      - 'ckan_ingestor/**/*'
      - 'ckan_dagster/**/*'

build:
  stage: build
  before_script:
    # Ensure git is available inside the job image; try common package managers.
    - |
      if command -v git >/dev/null 2>&1; then
        echo "git already installed"
      else
        echo "installing git"
        if [ -f /etc/alpine-release ]; then
          apk add --no-cache git
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y git
        elif command -v yum >/dev/null 2>&1; then
          yum install -y git
        else
          echo "Could not detect package manager to install git" >&2
          exit 1
        fi
      fi
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker context create builder
    - docker buildx create builder --use
    - docker buildx build 
      --build-arg BUILDKIT_INLINE_CACHE=1 
      --cache-from $CI_REGISTRY_IMAGE:latest 
      --platform linux/amd64,linux/arm64
      --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      --tag $CI_REGISTRY_IMAGE:latest 
      --push .

deploy-ingestor:
  stage: deploy
  variables:
    TF_ROOT:  "infra"
    TF_STATE_NAME:  "ingestor"
    TARGET_BRANCH: main
  trigger:
    strategy: depend
    include:
      - local: /templates/validate-plan-apply.yml
        inputs:
          base_os: "debian"
          root_dir: $TF_ROOT
          state_name: $TF_STATE_NAME
          stage_validate: build
          stage_build: build
          stage_deploy: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $TARGET_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $TARGET_BRANCH
