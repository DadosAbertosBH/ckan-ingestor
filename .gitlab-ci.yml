image: docker
services:
  - docker:dind

build:
  stage: build
  script:
    - cd ingestor
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker build --push -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .

deploy-ingestor:
  stage: deploy
  variables:
    TARGET_ENV: production
    TF_ROOT:  "infra"
    TF_STATE_NAME:  "ingestor"
    TARGET_BRANCH: main
  trigger:
    strategy: depend  
    include:
      - local: /templates/validate-plan-apply.yml
        inputs:
          version: 0.18.0
          opentofu_version: 1.7.1
          root_dir: $TF_ROOT
          state_name: $TF_STATE_NAME
          stage_validate: build
          stage_build: build
          stage_deploy: deploy
          runner_env: $TARGET_ENV  
  rules:
    - if: $CI_COMMIT_BRANCH == $TARGET_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $TARGET_BRANCH