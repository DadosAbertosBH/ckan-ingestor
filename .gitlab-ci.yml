build-worker-arm64:
  extends: .build-worker-base
  variables:
    TARGET_ARCH: arm64
  tags:
    - saas-linux-small-arm64

build-worker:
  stage: build
  timeout: 2h
  needs:
    # - build-worker-amd64
    - build-worker-arm64
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker context create builder
    - docker buildx create builder --use
    - |
      # AMD64="$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA-amd64"
      ARM64="$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA-arm64"
      docker buildx imagetools create \
        --tag "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE/worker:latest" \
        "$ARM64"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # amd64 (paused): "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA-amd64"
        docker buildx imagetools create \
          --tag "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_TAG" \
          "$CI_REGISTRY_IMAGE/worker:$CI_COMMIT_SHORT_SHA-arm64"
      fi
  rules: *release-tag-rules

