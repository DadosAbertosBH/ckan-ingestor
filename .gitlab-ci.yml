image: docker

stages:
  - lint
  - test
  - build
  - deploy

services:
  - name: docker:dind
    # explicitly disable tls to avoid docker startup interruption
    command: ["--tls=false"]

variables:
  # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
  DOCKER_HOST: "tcp://docker:2375"
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2

license-check:
  stage: lint
  image: alpine:latest
  script:
    - |
      missing=0
      for f in $(find . -name '*.py' -not -path './.venv/*' -not -path '*/site-packages/*' -not -path '*/.venv/*'); do
        if ! grep -q 'GNU AFFERO' "$f"; then
          echo "MISSING LICENSE HEADER: $f"
          missing=1
        fi
      done
      if [ "$missing" -eq 1 ]; then
        echo ""
        echo "Run ./add_license.sh to add missing headers."
        exit 1
      fi
      echo "All files have AGPL license headers."

test:
  stage: test
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  variables:
    UV_VERSION: "0.5"
    UV_CACHE_DIR: .uv-cache
    PYTHON_VERSION: "3.13"
    BASE_LAYER: bookworm-slim
    # GitLab CI creates a separate mountpoint for the build directory,
    # so we need to copy instead of using hard links.
    UV_LINK_MODE: copy
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
  script:
    - uv sync
    - uv pip install -e "ingestor_orchestrator/backend"
    - uv run ruff check
    - uv run pytest
    - uv cache prune --ci
  rules:
    - changes:
        - "ckan_ingestor/**/*"
        - "ingestor_orchestrator/**/*"

build:
  stage: build
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker context create builder
    - docker buildx create builder --use
    - docker buildx build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from $CI_REGISTRY_IMAGE:latest
      --platform linux/amd64,linux/arm64
      --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      --tag $CI_REGISTRY_IMAGE:latest
      --push .

build-orchestrator:
  stage: build
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
    - docker pull $CI_REGISTRY_IMAGE/orchestrator:latest || true
    - docker context create builder
    - docker buildx create builder --use
    - docker buildx build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from $CI_REGISTRY_IMAGE/orchestrator:latest
      --platform linux/amd64,linux/arm64
      --tag $CI_REGISTRY_IMAGE/orchestrator:$CI_COMMIT_SHORT_SHA
      --tag $CI_REGISTRY_IMAGE/orchestrator:latest
      --file ingestor_orchestrator/Dockerfile
      --push .
  rules:
    - changes:
        - "ingestor_orchestrator/**/*"
        - "ckan_ingestor/**/*"

deploy-ingestor:
  stage: deploy
  variables:
    TF_ROOT: "infra"
    TF_STATE_NAME: "ingestor"
    TARGET_BRANCH: main
  trigger:
    strategy: depend
    include:
      - local: /templates/validate-plan-apply.yml
        inputs:
          base_os: "debian"
          root_dir: $TF_ROOT
          state_name: $TF_STATE_NAME
          stage_validate: build
          stage_build: build
          stage_deploy: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $TARGET_BRANCH || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $TARGET_BRANCH

deploy-orchestrator:
  stage: deploy
  image:
    name: alpine/helm:3.16.2
    entrypoint: [""]
  variables:
    TARGET_BRANCH: main
    HELM_EXPERIMENTAL_OCI: 1
  before_script:
    - echo $CI_REGISTRY_PASSWORD | helm registry login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - |
      helm upgrade --install ingestor-orchestrator ./charts/ingestor-orchestrator \
        --namespace orchestrator \
        --create-namespace \
        --set global.image.registry=$CI_REGISTRY_IMAGE \
        --set global.image.tag=$CI_COMMIT_SHORT_SHA \
        --set api.image.repository=orchestrator \
        --set worker.image.repository=orchestrator \
        --set scheduler.image.repository=orchestrator \
        --wait \
        --timeout 5m
  rules:
    - if: $CI_COMMIT_BRANCH == $TARGET_BRANCH
