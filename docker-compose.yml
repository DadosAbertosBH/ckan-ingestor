version: '3'

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-08-03T04-33-23Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_ADDRESS=:9000
      - MINIO_CONSOLE_ADDRESS=:9001
    command: server /data
    healthcheck:
      test: "bash -c '[[ \"$(exec 3<>/dev/tcp/localhost/9000 && echo -e '\"'\"'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n'\"'\"' >&3 && cat <&3 | head -n 1)\" == *\"200 OK\"* ]] || exit 1'"
      interval: 5s
      timeout: 2s
      retries: 15
    networks:
      iceberg_net:
        ipv4_address: 10.5.0.3

  # Create MinIO bucket
  minio-setup:
    image: quay.io/minio/minio:RELEASE.2024-08-03T04-33-23Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc rm -r --force minio/warehouse;
      /usr/bin/mc mb minio/warehouse/;
      /usr/bin/mc policy set public minio/warehouse/;
      tail -f /dev/null
      "
    networks:
      iceberg_net:

  server:
    image: quay.io/lakekeeper/catalog:v0.4.3
    environment:
      - ICEBERG_REST__BASE_URI=http://10.5.0.4:8080
      - ICEBERG_REST__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - ICEBERG_REST__PG_DATABASE_URL_READ=postgresql://postgres:postgres@db:5432/postgres
      - ICEBERG_REST__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@db:5432/postgres
      - ICEBERG_REST__DEFAULT_PROJECT_ID=00000000-0000-0000-0000-000000000000
      - RUST_LOG=trace,axum=trace,sqlx=trace,iceberg-catalog=trace
    command: [ "serve" ]
    healthcheck:
      test: [ "CMD", "/home/nonroot/iceberg-catalog", "healthcheck" ]
      interval: 1s
      timeout: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      iceberg_net:
        ipv4_address: 10.5.0.4
    ports:
      - "8080:8080"

  migrate:
    image: quay.io/lakekeeper/catalog:latest
    environment:
      - ICEBERG_REST__PG_ENCRYPTION_KEY=This-is-NOT-Secure!
      - ICEBERG_REST__PG_DATABASE_URL_READ=postgresql://postgres:postgres@db:5432/postgres
      - ICEBERG_REST__PG_DATABASE_URL_WRITE=postgresql://postgres:postgres@db:5432/postgres
      - RUST_LOG=info
    restart: "no"
    entrypoint: [ "/home/nonroot/iceberg-catalog", "migrate" ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      iceberg_net:

  initialproject:
    image: curlimages/curl
    depends_on:
      server:
        condition: service_healthy
    restart: "no"
    networks:
      iceberg_net:
    command:
      - -w
      - "%{http_code}"
      - "-X"
      - "POST"
      - "-v"
      - "http://server:8080/management/v1/warehouse"
      - "-H"
      - "Content-Type: application/json"
      - "--data"
      - "@create-default-warehouse.json"
      - "-o"
      - "/dev/null"
      - "--fail-with-body"
    volumes:
      - ./docker-volumes/create-default-warehouse.json:/home/curl_user/create-default-warehouse.json

  db:
    image: bitnami/postgresql:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - PGUSER=postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p 5432 -d postgres" ]
      interval: 2s
      timeout: 10s
      retries: 2
    networks:
      iceberg_net:

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password

  nessie:
    image: ghcr.io/projectnessie/nessie:0.100.2
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /q/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 2s
      retries: 15
    depends_on:
      - mongo
      - minio
    ports:
     - "19120:19120"
    environment:
      - nessie.version.store.type=MONGODB
      - quarkus.mongodb.database=nessie
      - quarkus.mongodb.connection-string=mongodb://root:password@mongo:27017
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://warehouse/
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:my-secrets.s3-default
      - my-secrets.s3-default.name=admin
      - my-secrets.s3-default.secret=password
      # MinIO endpoint for Nessie server
      - nessie.catalog.service.s3.default-options.endpoint=http://10.5.0.3:9000/
      # MinIO endpoint for clients (on the Podman/Docker host)
      - nessie.catalog.service.s3.default-options.external-endpoint=http://127.0.0.1:9002/
    # Authorization settings.
    # In this example, Nessie is configured with 3 clients and 3 rules:
    # - client1: can access all namespaces
    # - client2: can access all namespaces except 'sales'
    # - client3: can access all namespaces except 'eng'
#    - nessie.server.authorization.enabled=false
#    - nessie.server.authorization.rules.client1=role=='service-account-client1'
#    - nessie.server.authorization.rules.client2=role=='service-account-client2' && !path.startsWith('sales')
#    - nessie.server.authorization.rules.client3=role=='service-account-client3' && !path.startsWith('eng')


  trino:
    image: trinodb/trino:latest
    environment:
      - CATALOG_MANAGEMENT=dynamic
    healthcheck:
      test: [ "CMD", "curl", "-I", "http://localhost:8080/v1/status" ]
      interval: 2s
      timeout: 10s
      retries: 2
    ports:
      - '9999:8080'
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./docker-volumes/trino/iceberg.properties:/etc/trino/catalog/iceberg.properties
      - ./docker-volumes/trino/config.properties:/etc/trino/config.properties
    networks:
      - iceberg_net

networks:
  iceberg_net:
    driver: bridge
    ipam:
     config:
       - subnet: 10.5.0.0/16
         gateway: 10.5.0.1