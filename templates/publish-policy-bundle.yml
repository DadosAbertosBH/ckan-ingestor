spec:
  inputs:
    # Job and Stage name
    as:
      default: 'publish-policy-bundle'
      description: 'Defines the name of this job.'
    stage:
      default: 'deploy'
      description: 'Defines the stage that this job will belong to.'

    # Configuration
    policy_dir:
      default: policy
      description: 'Root directory for the policies'
    rules:
      # FIXME: eventually, we'll want to define `null` as the default,
      # but this is NOT support yet, see
      # https://gitlab.com/gitlab-org/gitlab/-/issues/440468
      default: [{when: on_success}]
      type: array
      description: 'Defines the `rules` of the job.'
    opa_version:
      default: '1.4.2'
      type: string
      description: 'Open Policy Agent (OPA) version to download and run.'
    oras_version:
      default: '1.2.3'
      type: string
      description: 'ORAS CLI version to download and run.'
    policy_bundle_name:
      default: policy
      type: string
      description: 'Name of the policy bundle to publish.'
    policy_bundle_version:
      default: $CI_COMMIT_TAG
      type: string
      description: 'Version of the policy bundle to publish.'

---


'$[[ inputs.as ]]':
  stage: $[[ inputs.stage ]]
  rules: $[[ inputs.rules ]]
  image: alpine:3.21.3
  cache:
    key: "gitlab-tofu-publish-policy-bundle-$[[ inputs.opa_version ]]-$[[ inputs.oras_version ]]-${CI_RUNNER_EXECUTABLE_ARCH}"
    paths:
      - ./.gitlab-tofu/bin/tmp
  artifacts:
    paths:
      - opa-config.yml
  before_script:
    # Install OPA
    - |
      if [ -f "./.gitlab-tofu/bin/tmp/opa" ]; then
        echo "OPA version '$[[ inputs.opa_version ]]' for '${CI_RUNNER_EXECUTABLE_ARCH}' found in cache, reusing it."
      else
        arch="$(echo "${CI_RUNNER_EXECUTABLE_ARCH}" | cut -d '/' -f2)"
        echo "Downloading OPA version '$[[ inputs.opa_version ]]' for arch '$arch' ..."
        mkdir -p ./.gitlab-tofu/bin/tmp
        wget "https://github.com/open-policy-agent/opa/releases/download/v$[[ inputs.opa_version ]]/opa_linux_${arch}_static" -O ./opa
        chmod +x ./opa
        mv ./opa ./.gitlab-tofu/bin/tmp
      fi
    - ./.gitlab-tofu/bin/tmp/opa version
    # Install ORAS CLI
    - |
      if [ -f "./.gitlab-tofu/bin/tmp/oras" ]; then
        echo "OPA version '$[[ inputs.oras_version ]]' for '${CI_RUNNER_EXECUTABLE_ARCH}' found in cache, reusing it."
      else
        arch="$(echo "${CI_RUNNER_EXECUTABLE_ARCH}" | cut -d '/' -f2)"
        echo "Downloading OPA version '$[[ inputs.oras_version ]]' for arch '$arch' ..."
        mkdir -p ./.gitlab-tofu/bin/tmp
        wget "https://github.com/oras-project/oras/releases/download/v$[[ inputs.oras_version ]]/oras_$[[ inputs.oras_version ]]_linux_${arch}.tar.gz" -O ./oras.tar.gz
        tar xvfz oras.tar.gz
        chmod +x ./oras
        mv ./oras ./.gitlab-tofu/bin/tmp
      fi
    - ./.gitlab-tofu/bin/tmp/oras version
  script:
    - ./.gitlab-tofu/bin/tmp/oras login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - ./.gitlab-tofu/bin/tmp/opa build "$[[ inputs.policy_dir ]]"
    - echo '{}' > config.json
    - ./.gitlab-tofu/bin/tmp/oras push "${CI_REGISTRY_IMAGE}/$[[ inputs.policy_bundle_name ]]:$[[ inputs.policy_bundle_version ]]" --config config.json:application/vnd.oci.image.config.v1+json bundle.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip
    # Write OPA config to download bundles
    - |
      cat <<EOF > opa-config.yml
      services:
        gitlab-registry:
          url: https://${CI_REGISTRY}
          type: oci
          credentials:
            bearer:
              scheme: "Bearer"
              token: "\$CI_JOB_TOKEN"

      bundles:
        policies:
          service: gitlab-registry
          resource: ${CI_REGISTRY_IMAGE}/$[[ inputs.policy_bundle_name ]]:$[[ inputs.policy_bundle_version ]]
          persist: true
      EOF
