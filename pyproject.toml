authors = [{ name = "guilhermecastro", email = "guilherme.castro@protonmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
dependencies = []

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "flask>=3.1.1",
    "flask-cors>=6.0.0",
    "mock>=5.1.0,<6",
    "pytest>=8.3.2,<9",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12.0",
    "testcontainers[postgres]>=4.14.2,<5",
]

[tool.uv]
package = false
