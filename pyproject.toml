[tool.poetry]
name = "ckan-ingestor"
version = "0.1.0"
description = ""
authors = ["guilhermecastro <guilherme.castro@protonmail.com>"]
readme = "README.md"
packages = [{include = "ckan_ingestor"}]

[tool.poetry.dependencies]
python = ">=3.11.9,<3.13"
deltalake = "^0.22.0"
ckanapi = "^4.8"
pyarrow = "^18.0.0"
pytest = "^8.3.3"
pydantic-settings = "^2.6.1"
pyiceberg = "^0.8.0"
dlt = {extras = ["s3"], version = "^1.5.0"}
trino = {extras = ["sqlalchemy"], version = "^0.330.0"}
alembic = "^1.14.0"
duckdb = "^1.1.3"
sqlglot = "^26.0.1"


[tool.poetry.group.dev.dependencies]
mock = "^5.1.0"
pytest = "^8.3.2"
testcontainers = {extras = ["minio"], version = "^4.8.1"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
