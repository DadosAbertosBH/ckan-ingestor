[project]
name = "ckan-ingestor"
version = "0.1.0"
description = ""
authors = [{ name = "guilhermecastro", email = "guilherme.castro@protonmail.com" }]
requires-python = ">=3.11.9,<3.13"
readme = "README.md"
dependencies = [
    "pyarrow>=18.0.0,<19",
    "pytest>=8.3.3,<9",
    "pydantic-settings>=2.6.1,<3",

    "duckdb>=1.5.3,<2",
    "minio>=7.2.15",
    "dagster>=1.10.19",
    "dagster-webserver>=1.10.19",
    "dagster-duckdb>=0.26.19",
    "dagster-duckdb-pandas>=0.26.19",
    "pandas>=2.3.0",
    "pyiceberg>=0.9.1",
    "dagster-dask>=0.26.19",
    "dagster-postgres>=0.26.19",
    "dagster-celery[flower,redis]>=0.27.0",
    "dagster-celery-k8s>=0.27.0",
    # Use the community-integrations source so the package includes the expected module path
    "dagster-async-executor @ git+https://github.com/dagster-io/community-integrations.git@main#subdirectory=libraries/dagster-async-executor",
]

[dependency-groups]
dev = [
    "flask>=3.1.1",
    "flask-cors>=6.0.0",
    "mock>=5.1.0,<6",
    "pytest>=8.3.2,<9",
    "ruff>=0.12.0",
    "testcontainers[minio, postgres]>=4.13.3,<5",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["ckan_ingestor"]

[tool.hatch.build.targets.wheel]
include = ["ckan_ingestor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
