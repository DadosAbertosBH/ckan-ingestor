[project]
name = "ckan-ingestor"
version = "0.1.0"
description = "Core CKAN data ingestion library"
authors = [{ name = "guilhermecastro", email = "guilherme.castro@protonmail.com" }]
requires-python = ">=3.11.9,<3.13"
readme = "README.md"
dependencies = [
    "pyarrow>=18.0.0,<19",
    "pydantic-settings>=2.6.1,<3",
    "duckdb>=1.5.3,<2",
    "minio>=7.2.15",
    "pandas>=2.3.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "flask>=3.1.1",
    "flask-cors>=6.0.0",
    "mock>=5.1.0,<6",
    "pytest>=8.3.2,<9",
    "ruff>=0.12.0",
    "testcontainers[minio, postgres]>=4.13.3,<5",
]

[tool.hatch.build.targets.sdist]
include = ["ckan_ingestor"]

[tool.hatch.build.targets.wheel]
include = ["ckan_ingestor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
