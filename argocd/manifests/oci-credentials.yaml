# ⚠️ Criptografe este arquivo com SOPS antes de commitar:
#    sops --encrypt argocd/manifests/oci-credentials.yaml > argocd/manifests/oci-credentials.enc.yaml
#
# O ArgoCD descriptografa SOPS nativamente se configurado.
apiVersion: v1
kind: Secret
metadata:
  name: oci-api-key
  namespace: orchestrator
  labels:
    app.kubernetes.io/part-of: ingestor-orchestrator
type: Opaque
stringData:
  # -- Chave privada OCI (conteúdo do ~/.oci/private-key.pem)
  # Gere o valor com: cat ~/.oci/private-key.pem
  key_file: |
    -----BEGIN PRIVATE KEY-----
    SUA_CHAVE_PRIVADA_AQUI
    -----END PRIVATE KEY-----
