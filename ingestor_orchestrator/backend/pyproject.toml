[project]
name = "ckan-orchestrator"
version = "0.1.0"
description = "Lightweight CKAN data pipeline orchestrator replacing Dagster"
requires-python = ">=3.11"
license = "AGPL-3.0"
dependencies = [
    "ckan-ingestor",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "cryptography>=43.0.0",
    "alembic>=1.14.0",
    "nats-py[nkeys]>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
orchestrator-api = "ckan_orchestrator.main:run"
orchestrator-worker = "ckan_orchestrator.worker.consumer:run_standalone"
orchestrator-scheduler = "ckan_orchestrator.services.scheduler:run_standalone"
orchestrator-sync-metadata = "ckan_orchestrator.services.metadata_sync:run_standalone"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
