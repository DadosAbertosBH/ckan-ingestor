[project]
name = "ingestor-orchestrator"
version = "0.1.0"
description = "Lightweight CKAN data pipeline orchestrator replacing Dagster"
requires-python = ">=3.13"
license = "AGPL-3.0"
dependencies = [
    "ckan-ingestor",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "cryptography>=43.0.0",
    "alembic>=1.14.0",
    "nats-py[nkeys]>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "kafka-python>=2.3.2",
    "confluent-kafka>=2.14.2",
]

[project.scripts]
orchestrator-api = "ingestor_orchestrator.main:run"
orchestrator-worker = "ingestor_orchestrator.worker.consumer:run_standalone"
orchestrator-scheduler = "ingestor_orchestrator.services.scheduler:run_standalone"
orchestrator-sync-metadata = "ingestor_orchestrator.services.metadata_sync:run_standalone"

[tool.hatch.build.targets.wheel]
packages = ["ingestor_orchestrator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "testcontainers[kafka]>=4.14.2,<5",
]

[tool.uv.sources]
ckan-ingestor = { path = "../../", editable = true }
