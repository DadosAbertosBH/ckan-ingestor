services:
  oracle:
    image: container-registry.oracle.com/database/free:latest-lite
    hostname: oracle
    cap_add: [SYS_ADMIN]
    devices: [/dev/fuse]
    mem_limit: ${INGEST_ORCH_ORACLE_MEMORY:-2g}
    cpus: 1
    environment:
      ORACLE_PWD: ${INGEST_ORCH_ORACLE_ADMIN_PASSWORD:-ContractCKAN123!}
      DISABLE_ORDS: true
    ports: ["1522:1521"]
    healthcheck:
      test: ["CMD-SHELL", "lsnrctl status | grep -q 'STATUS of the LISTENER'"]
      interval: 10s
      timeout: 10s
      retries: 120
      start_period: 60s
    networks: [orchestrator_net]

  oracle-bootstrap:
    image: container-registry.oracle.com/database/free:latest-lite
    user: root
    entrypoint: [bash, /bootstrap-oracle.sh]
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      - ORACLE_PWD=${INGEST_ORCH_ORACLE_ADMIN_PASSWORD:-ContractCKAN123!}
      - APP_PASSWORD=${INGEST_ORCH_ORACLE_PASSWORD:-ContractApp123}
    volumes:
      - ./bootstrap-oracle.sh:/bootstrap-oracle.sh:ro
    networks: [orchestrator_net]

  mysql:
    profiles: [mysql]
    image: mysql:8.0
    deploy:
      resources:
        limits:
          memory: "256M"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator_net

  iggy:
    image: apache/iggy:0.9.0
    ports:
      - "8090:8090"
      - "3000:3000"
    cap_add:
      - IPC_LOCK
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      IGGY_ROOT_USERNAME: iggy
      IGGY_ROOT_PASSWORD: iggy
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
      IGGY_HTTP_ADDRESS: 0.0.0.0:3000
      IGGY_NODE_ADVERTISED_ADDRESS: 127.0.0.1
      IGGY_PATH: /app/local_data
      IGGY_SHARDING_CPU_ALLOCATION: all
    healthcheck:
      test: ["CMD", "/usr/local/bin/iggy", "-u", "iggy", "-p", "iggy", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orchestrator_net

  iggy-web-ui:
    image: apache/iggy-web-ui:latest
    ports:
      - "${IGGY_WEB_UI_PORT:-3050}:3050"
    environment:
      PUBLIC_IGGY_API_URL: ${IGGY_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      iggy:
        condition: service_healthy
    networks:
      - orchestrator_net

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["--access-key", "admin", "--secret-key", "password", "/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 2s
      retries: 15
    networks:
      - orchestrator_net

  rustfs-setup:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rc alias set local http://rustfs:9000 admin password &&
        rc bucket create local/warehouse --ignore-existing
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - orchestrator_net

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ducklake_catalog
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 10s
      retries: 5
    networks:
      - orchestrator_net

  db-init:
    build:
      context: ..
      dockerfile: ingestor_orchestrator/Dockerfile
    depends_on:
      oracle-bootstrap:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      INGEST_ORCH_DB_PROVIDER: oracle
      INGEST_ORCH_ORACLE_DSN: "${INGEST_ORCH_ORACLE_DSN:-oracle://CKAN_APP:ContractApp123@oracle:1521/FREEPDB1}"
      INGEST_ORCH_MYSQL_HOST: mysql
      INGEST_ORCH_MYSQL_PORT: "3306"
      INGEST_ORCH_MYSQL_USER: root
      INGEST_ORCH_MYSQL_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      INGEST_ORCH_MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
    command: ["migrate"]
    networks:
      - orchestrator_net

  api:
    build:
      context: ..
      dockerfile: ingestor_orchestrator/Dockerfile
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1024M"
    depends_on:
      oracle-bootstrap:
        condition: service_completed_successfully
      iggy:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      INGEST_ORCH_DB_PROVIDER: oracle
      INGEST_ORCH_ORACLE_DSN: "${INGEST_ORCH_ORACLE_DSN:-oracle://CKAN_APP:ContractApp123@oracle:1521/FREEPDB1}"
      INGEST_ORCH_MYSQL_HOST: mysql
      INGEST_ORCH_MYSQL_PORT: "3306"
      INGEST_ORCH_MYSQL_USER: root
      INGEST_ORCH_MYSQL_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      INGEST_ORCH_MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
      INGEST_ORCH_IGGY_ADDRESS: iggy:8090
      INGEST_ORCH_IGGY_USERNAME: iggy
      INGEST_ORCH_IGGY_PASSWORD: iggy
    networks:
      - orchestrator_net

  worker-rust:
    build:
      context: ../ckan-ingestor-rs
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "8192M"
    depends_on:
      iggy:
        condition: service_healthy
      rustfs-setup:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    environment:
      IGGY_ADDRESS: iggy:8090
      IGGY_USERNAME: iggy
      IGGY_PASSWORD: iggy
      IGGY_STREAM: ckan-ingestor
      IGGY_TOPIC: jobs
      IGGY_TOPIC_RETRY: jobs-retry
      IGGY_TOPIC_RESULTS: job-results
      IGGY_GROUP_ID: ckan-worker
      IGGY_JOB_PARTITIONS: "3"
      IGGY_RETRY_PARTITIONS: "3"
      DUCKLAKE_DATABASE: ":memory:"
      DUCKLAKE_CATALOG_URI: "postgres:dbname=ducklake_catalog host=postgres user=postgres password=postgres"
      S3_ENDPOINT: rustfs:9000
      S3_BUCKET: warehouse
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: password
      S3_USE_SSL: "false"
      S3_URL_STYLE: path
      RUST_LOG: "info,memory_profile=info"
    networks:
      - orchestrator_net

  worker-coordinator:
    build:
      context: ../ckan-ingestor-rs
      dockerfile: Dockerfile
      args:
        WORKER_PACKAGE: ckan_worker_coordinator
        WORKER_BINARY: ckan-worker-coordinator
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    depends_on:
      iggy:
        condition: service_healthy
      rustfs-setup:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    environment:
      IGGY_ADDRESS: iggy:8090
      IGGY_USERNAME: iggy
      IGGY_PASSWORD: iggy
      IGGY_STREAM: ckan-ingestor
      IGGY_TOPIC: jobs
      IGGY_TOPIC_RETRY: jobs-retry
      IGGY_TOPIC_RESULTS: job-results
      IGGY_RESULT_PARTITIONS: "1"
      DUCKLAKE_DATABASE: ":memory:"
      DUCKLAKE_CATALOG_URI: "postgres:dbname=ducklake_catalog host=postgres user=postgres password=postgres"
      S3_ENDPOINT: rustfs:9000
      S3_BUCKET: warehouse
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: password
      S3_USE_SSL: "false"
      S3_URL_STYLE: path
      RUST_LOG: "info,memory_profile=info"
    networks:
      - orchestrator_net

  source-sync-worker:
    image: ckan-ingestor/source-sync-worker:local
    build:
      context: ..
      dockerfile: ingestor_orchestrator/source-sync-worker/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      oracle-bootstrap:
        condition: service_completed_successfully
      iggy:
        condition: service_healthy
      rustfs-setup:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    environment:
      INGEST_ORCH_DB_PROVIDER: oracle
      INGEST_ORCH_ORACLE_DSN: "${INGEST_ORCH_ORACLE_DSN:-oracle://CKAN_APP:ContractApp123@oracle:1521/FREEPDB1}"
      INGEST_ORCH_MYSQL_HOST: mysql
      INGEST_ORCH_MYSQL_PORT: "3306"
      INGEST_ORCH_MYSQL_USER: root
      INGEST_ORCH_MYSQL_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      INGEST_ORCH_MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
      IGGY_ADDRESS: iggy:8090
      IGGY_USERNAME: iggy
      IGGY_PASSWORD: iggy
      IGGY_STREAM: ckan-ingestor
      IGGY_TOPIC: jobs
      IGGY_TOPIC_RESULTS: job-results
      IGGY_METADATA_SYNC_TOPIC: ckan_metadata_sync
      IGGY_METADATA_SYNC_RESULT_TOPIC: ckan_metadata_sync_result
      IGGY_METADATA_SYNC_GROUP_ID: source-sync-worker
      S3_ENDPOINT: rustfs:9000
      S3_BUCKET: warehouse
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: password
      S3_USE_SSL: "false"
      S3_URL_STYLE: path
      S3_PUBLIC_URL: http://rustfs:9000
      SICOM_LIGHTPANDA_BIN: /usr/local/bin/lightpanda
      SICOM_ORCHESTRATOR_URL: http://api:8000
    networks:
      - orchestrator_net

networks:
  orchestrator_net:
    driver: bridge
