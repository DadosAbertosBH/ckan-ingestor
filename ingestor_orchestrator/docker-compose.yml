services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator_net

  iggy:
    image: apache/iggy:0.8.0
    ports:
      - "8090:8090"
      - "3000:3000"
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      IGGY_ROOT_USERNAME: iggy
      IGGY_ROOT_PASSWORD: iggy
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
      IGGY_HTTP_ADDRESS: 0.0.0.0:3000
    volumes:
      - iggy_data:/iggy/local_data
    healthcheck:
      test: ["CMD", "/usr/local/bin/iggy", "-u", "iggy", "-p", "iggy", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orchestrator_net

  iggy-web-ui:
    image: apache/iggy-web-ui:latest
    ports:
      - "${IGGY_WEB_UI_PORT:-3050}:3050"
    environment:
      PUBLIC_IGGY_API_URL: ${IGGY_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      iggy:
        condition: service_healthy
    networks:
      - orchestrator_net

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["--access-key", "admin", "--secret-key", "password", "/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 2s
      retries: 15
    networks:
      - orchestrator_net

  rustfs-setup:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rc alias set local http://rustfs:9000 admin password &&
        rc bucket create local/warehouse --ignore-existing
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - orchestrator_net

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ducklake_catalog
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 10s
      retries: 5
    networks:
      - orchestrator_net

  db-init:
    build:
      context: ..
      dockerfile: ingestor_orchestrator/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      INGEST_ORCH_MYSQL_HOST: mysql
      INGEST_ORCH_MYSQL_PORT: "3306"
      INGEST_ORCH_MYSQL_USER: root
      INGEST_ORCH_MYSQL_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      INGEST_ORCH_MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
    command: alembic -c ingestor_orchestrator/backend/alembic.ini upgrade head
    networks:
      - orchestrator_net

  api:
    build:
      context: ..
      dockerfile: ingestor_orchestrator/Dockerfile
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1024M"
    depends_on:
      mysql:
        condition: service_healthy
      iggy:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      INGEST_ORCH_MYSQL_HOST: mysql
      INGEST_ORCH_MYSQL_PORT: "3306"
      INGEST_ORCH_MYSQL_USER: root
      INGEST_ORCH_MYSQL_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      INGEST_ORCH_MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
      INGEST_ORCH_IGGY_ADDRESS: iggy:8090
      INGEST_ORCH_IGGY_USERNAME: iggy
      INGEST_ORCH_IGGY_PASSWORD: iggy
    command: uvicorn ingestor_orchestrator.main:app --host 0.0.0.0 --port 8000
    networks:
      - orchestrator_net

  worker-rust:
    build:
      context: ../ckan-ingestor-rs
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: "8192M"
    depends_on:
      iggy:
        condition: service_healthy
      rustfs-setup:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    environment:
      IGGY_ADDRESS: iggy:8090
      IGGY_USERNAME: iggy
      IGGY_PASSWORD: iggy
      IGGY_STREAM: ckan-ingestor
      IGGY_TOPIC: jobs
      IGGY_TOPIC_RETRY: jobs-retry
      IGGY_TOPIC_RESULTS: job-results
      IGGY_GROUP_ID: ckan-worker
      IGGY_PARTITIONS: "10"
      DUCKLAKE_DATABASE: ":memory:"
      DUCKLAKE_CATALOG_URI: "postgres:dbname=ducklake_catalog host=postgres user=postgres password=postgres"
      S3_ENDPOINT: rustfs:9000
      S3_BUCKET: warehouse
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: password
      S3_USE_SSL: "false"
      S3_URL_STYLE: path
      RUST_LOG: "info,memory_profile=info"
    networks:
      - orchestrator_net

  worker-coordinator:
    build:
      context: ../ckan-ingestor-rs
      dockerfile: Dockerfile
      args:
        WORKER_PACKAGE: ckan_worker_coordinator
        WORKER_BINARY: ckan-worker-coordinator
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1024M"
    depends_on:
      iggy:
        condition: service_healthy
      rustfs-setup:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    environment:
      IGGY_ADDRESS: iggy:8090
      IGGY_USERNAME: iggy
      IGGY_PASSWORD: iggy
      IGGY_STREAM: ckan-ingestor
      IGGY_TOPIC: jobs
      IGGY_TOPIC_RETRY: jobs-retry
      IGGY_TOPIC_RESULTS: job-results
      IGGY_METADATA_SYNC_TOPIC: ckan_metadata_sync
      IGGY_METADATA_SYNC_RESULT_TOPIC: ckan_metadata_sync_result
      IGGY_METADATA_SYNC_GROUP_ID: ckan-metadata-sync-worker
      IGGY_PARTITIONS: "10"
      INGEST_ORCH_MYSQL_HOST: mysql
      INGEST_ORCH_MYSQL_PORT: "3306"
      INGEST_ORCH_MYSQL_USER: root
      INGEST_ORCH_MYSQL_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      INGEST_ORCH_MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
      DUCKLAKE_DATABASE: ":memory:"
      DUCKLAKE_CATALOG_URI: "postgres:dbname=ducklake_catalog host=postgres user=postgres password=postgres"
      S3_ENDPOINT: rustfs:9000
      S3_BUCKET: warehouse
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: password
      S3_USE_SSL: "false"
      S3_URL_STYLE: path
      RUST_LOG: "info,memory_profile=info"
    networks:
      - orchestrator_net

volumes:
  mysql_data:
  iggy_data:

networks:
  orchestrator_net:
    driver: bridge
