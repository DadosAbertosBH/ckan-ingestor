services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator_net

  kafka:
    image: apache/kafka-native:4.2.1
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orchestrator_net

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.9.0
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
    networks:
      - orchestrator_net

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["--access-key", "admin", "--secret-key", "password", "/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 2s
      retries: 15
    networks:
      - orchestrator_net

  rustfs-setup:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rc alias set local http://rustfs:9000 admin password &&
        rc bucket create local/warehouse --ignore-existing
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - orchestrator_net

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ducklake_catalog
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 10s
      retries: 5
    networks:
      - orchestrator_net

  db-init:
    build:
      context: ..
      dockerfile: ingestor_orchestrator/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      INGEST_ORCH_MYSQL_HOST: mysql
      INGEST_ORCH_MYSQL_PORT: "3306"
      INGEST_ORCH_MYSQL_USER: root
      INGEST_ORCH_MYSQL_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      INGEST_ORCH_MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
    command: alembic -c ingestor_orchestrator/backend/alembic.ini upgrade head
    networks:
      - orchestrator_net

  api:
    build:
      context: ..
      dockerfile: ingestor_orchestrator/Dockerfile
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1024M"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      INGEST_ORCH_MYSQL_HOST: mysql
      INGEST_ORCH_MYSQL_PORT: "3306"
      INGEST_ORCH_MYSQL_USER: root
      INGEST_ORCH_MYSQL_PASSWORD: ${INGEST_ORCH_MYSQL_PASSWORD:-ckan_orch_pass}
      INGEST_ORCH_MYSQL_DATABASE: ${INGEST_ORCH_MYSQL_DATABASE:-ingestor_orchestrator}
      INGEST_ORCH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: uvicorn ingestor_orchestrator.main:app --host 0.0.0.0 --port 8000
    networks:
      - orchestrator_net

  worker-rust:
    build:
      context: ../ckan-ingestor-rs
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4096M"
    depends_on:
      kafka:
        condition: service_healthy
      rustfs-setup:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ckan.ingest.jobs
      KAFKA_TOPIC_RETRY: ckan.ingest.jobs.retry
      KAFKA_GROUP_ID: ckan-worker
      DUCKLAKE_DATABASE: ":memory:"
      DUCKLAKE_CATALOG_URI: "postgres:dbname=ducklake_catalog host=postgres user=postgres password=postgres"
      S3_ENDPOINT: rustfs:9000
      S3_BUCKET: warehouse
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: password
      S3_USE_SSL: "false"
      S3_URL_STYLE: path
      RUST_LOG: info
    networks:
      - orchestrator_net

volumes:
  mysql_data:
  kafka_data:

networks:
  orchestrator_net:
    driver: bridge
