  #     - "io.polaris.service.PolarisApplication" 
  #     - "server"
  #     - "polaris-server.yml"
  #   networks:
  #     iceberg_net:
  #   ports:
  #     - 8182:8181
  #   volumes:
  #   - ./polaris/polaris-server.yml:/app/polaris-server.yml
  #   - ./polaris/h2-2.3.230.jar:/app/h2-2.3.230.jar
  #   - ./polaris/persistence.xml:/app/local-persistence.xml
  #   # - ./tmp/eclipseLink:/tmp/eclipseLink/    

  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio
    ports:
      - 9001:9001
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]
  mc:
    depends_on:
      - minio
    image: minio/mc
    container_name: mc
    networks:
      iceberg_net:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc rm -r --force minio/warehouse;
      /usr/bin/mc mb minio/warehouse/;
      /usr/bin/mc policy set public minio/warehouse/;
      tail -f /dev/null
      "

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    ports:
      - "8080:8080"
      - "9010:9000"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/iceberg-realm.json:/opt/keycloak/data/import/iceberg-realm.json
    command: [
      "start-dev",
      "--features=token-exchange",
      "--import-realm",
      "--health-enabled=true"
    ]
    networks:
      iceberg_net:  
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 2s
      retries: 15  

networks:
  iceberg_net:        