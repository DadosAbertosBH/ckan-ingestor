  xtable:
    image: registry.gitlab.com/pedalin/xtable-docker-image:5bf38428      
    container_name: xtable
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-password}
      - AWS_REGION=us-east-1 
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://minio:9000}
    networks:
      iceberg_net:
    depends_on:
      - rest
      - minio
    volumes:
      - ./xtable:/xtable
    command: ["--datasetConfig", "/xtable/config.yml", "--hadoopConfig", "/xtable/core-site.xml", "--icebergCatalogConfig", "/xtable/catalog.yml"]

  rest:
    image: tabulario/iceberg-rest
    networks:
      iceberg_net:
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-password}
      - AWS_REGION=us-east-1 
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000

  nessie:
    image: ghcr.io/projectnessie/nessie
    container_name: nessie
    environment:
      - QUARKUS_HTTP_ACCESS_LOG_PATTERN=%h %l %u %t "%r" %s %b %m %{ALL_REQUEST_HEADERS}
      - nessie.server.authentication.enabled=true
      - quarkus.oidc.auth-server-url=http://keycloak:8080/realms/iceberg
      - quarkus.oidc.client-id=client1
      - quarkus.oidc.token.issuer=http://127.0.0.1:8080/realms/iceberg    
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://warehouse/
      - nessie.catalog.service.s3.default-options.default-options.request-signing-enabled=true
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.access-key.name=admin
      - nessie.catalog.service.s3.default-options.access-key.secret=password
      # MinIO endpoint for Nessie server
      - nessie.catalog.service.s3.default-options.endpoint=http://minio:9000/    
      # - client1: can access all namespaces
      - nessie.server.authorization.rules.client1=role=='service-account-client1'
    networks:
      iceberg_net:
    ports:
      - 19120:19120      

  dremio:
    platform: linux/x86_64
    image: dremio/dremio-oss:latest
    ports:
      - 9047:9047
      - 31010:31010
      - 32010:32010
    container_name: dremio
    environment:
      - DREMIO_JAVA_SERVER_EXTRA_OPTS=-Dpaths.dist=file:///opt/dremio/data/dist
    networks:
      iceberg_net:

  # polaris:
  #   image: polaris-eclipselink
  #   environment:
  #     - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
  #     - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-password}
