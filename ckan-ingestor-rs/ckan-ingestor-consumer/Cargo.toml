[package]
name = "ckan_ingestor_consumer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ckan-ingestor-consumer"
path = "src/main.rs"

[dependencies]
ckan_ingestor_lib = { path = "../ckan-ingestor-lib", default-features = false }
ckan_ingestor_worker_lib = { path = "../ckan-ingestor-worker-lib" }
iggy_processor = { path = "../iggy-processor" }
message_processor = { path = "../message-processor" }
async-stream = "0.3"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rustls = { version = "0.23", features = ["ring"] }
object_store = { version = "=0.13.2", default-features = false, features = ["aws", "fs"] }
url = "2"
base64 = "0.22"
arrow-ipc = "=59.2.0"
arrow = "=59.2.0"

[dev-dependencies]
message_processor = { path = "../message-processor", features = ["test-support"] }
httpmock = "0.7"
testcontainers = "0.28"
