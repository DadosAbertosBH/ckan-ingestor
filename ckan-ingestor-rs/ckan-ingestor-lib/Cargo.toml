[package]
name = "ckan_ingestor_lib"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
arrow = { version = "58.4.0", features = ["ipc"] }
arrow-ipc = "58.4.0"
duckdb = "1.5.5"
uuid = { version = "1.17.0", features = ["v4"] }
bytes = "1.10"
libduckdb-sys = "1.5.5"
rust-s3 = { version = "0.37", default-features = false, features = ["sync-rustls-tls"] }

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }
rstest = "0.26.1"
wiremock = "0.6.5"
testcontainers = { version = "0.28", features = ["blocking"] }
flate2 = "1"
