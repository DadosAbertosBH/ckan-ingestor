[package]
name = "ckan_ingestor_lib"
version = "0.1.0"
edition = "2021"

[features]
default = ["ducklake-backend"]
ducklake-backend = ["dep:ducklake"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
arrow = "=59.2.0"
arrow-csv = "=59.2.0"
arrow-json = "=59.2.0"
arrow-ipc = "=59.2.0"
parquet = { version = "=59.2.0", features = ["arrow"] }
geoarrow-array = "=0.9.0"
geoarrow-schema = "=0.9.0"
geoparquet = "=0.9.0"
geo-types = "=0.7.20"
geojson = "=0.24.2"
uuid = { version = "1.17.0", features = ["v4"] }
bytes = "1.10"
chrono = "0.4"
object_store = { version = "=0.13.2", default-features = false, features = ["aws", "fs"] }
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "rt", "sync"] }
url = "2"
csv-nose = { git = "https://github.com/guitcastro/csv-nose.git", branch = "feat/force-header-preamble" }
flate2 = "1"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
regex = "1"
ducklake = { version = "0.0.19", default-features = false, features = ["aws", "postgres", "sqlite"], optional = true }
prost-reflect = { version = "0.16", features = ["serde"] }

[build-dependencies]
protox = "0.9"

[dev-dependencies]
httpmock = "0.7"
rstest = "0.26.1"
wiremock = "0.6.5"
testcontainers = { version = "0.28", features = ["blocking"] }
tempfile = "3"
