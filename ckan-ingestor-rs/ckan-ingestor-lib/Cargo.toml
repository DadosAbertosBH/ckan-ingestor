[package]
name = "ckan_ingestor_lib"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
duckdb = { version = "1.5.5", features = ["vtab-arrow"] }
uuid = { version = "1.17.0", features = ["v4"] }
futures = "0.3.31"
bytes = "1.10"
libduckdb-sys = "1.5.5"
tokio = { version = "1.0", features = ["rt"] }
aws-config = { version = "1.1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-sdk-s3 = { version = "1.14", default-features = false, features = ["rustls", "rt-tokio"] }

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }
rstest = "0.26.1"
wiremock = "0.6.5"
testcontainers = "0.23"
aws-config = { version = "1.1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
