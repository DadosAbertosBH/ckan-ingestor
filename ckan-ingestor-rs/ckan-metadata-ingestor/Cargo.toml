[package]
name = "ckan_metadata_ingestor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
ckan_ingestor_lib = { path = "../ckan-ingestor-lib" }
duckdb = "1.5.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"

[dev-dependencies]
httpmock = "0.7"
