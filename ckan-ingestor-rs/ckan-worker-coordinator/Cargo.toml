[package]
name = "ckan_worker_coordinator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ckan-worker-coordinator"
path = "src/main.rs"

[dependencies]
ckan_ingestor_lib = { path = "../ckan-ingestor-lib" }
ckan_ingestor_worker_lib = { path = "../ckan-ingestor-worker-lib" }
iggy_processor = { path = "../iggy-processor" }
message_processor = { path = "../message-processor" }
ckan_metadata_ingestor = { path = "../ckan-metadata-ingestor" }
futures = "0.3"
async-stream = "0.3"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "sync", "signal", "time"] }
serde_json = "1.0"
serde = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
ducklake = { version = "0.0.19", default-features = false, features = ["aws", "postgres", "sqlite"] }
arrow = "=59.2.0"
arrow-ipc = "=59.2.0"
object_store = { version = "0.13", features = ["aws"] }
parquet = { version = "=59.2.0", features = ["arrow"] }
url = "2.5"
base64 = "0.22"
rustls = { version = "0.23", features = ["ring"] }
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
testcontainers = "0.28"
tempfile = "3"
